[package]
name = "senda-command-center"
version = "0.1.0"
description = "SENDA Command Center — offline-first emergency coordination console"
authors = ["Abraham Haddioui"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
