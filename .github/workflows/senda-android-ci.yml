name: SENDA Android (compilación)
on:
  push:
    branches: [master]
    paths: ['apps/senda-android/**', 'investor-next/public/senda/**', 'packages/senda/conformance/**', '.github/workflows/senda-android-ci.yml']
  pull_request:
    paths: ['apps/senda-android/**', 'investor-next/public/senda/**', 'packages/senda/conformance/**', '.github/workflows/senda-android-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    name: Formatos (JVM) + APK de depuración
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Paridad de formatos con la web (baliza, barrido, enlace senda://)
        run: |
          mkdir -p "$RUNNER_TEMP/jvm"
          javac --release 17 -d "$RUNNER_TEMP/jvm" apps/senda-android/app/src/main/java/eu/senda/field/SendaFormats.java apps/senda-android/app/src/main/java/eu/senda/field/NativeAction.java apps/senda-android/app/src/main/java/eu/senda/field/OfflineAssets.java apps/senda-android/app/src/test/java/eu/senda/field/SendaFormatsTest.java apps/senda-android/app/src/test/java/eu/senda/field/OfflineAssetsTest.java
          java -cp "$RUNNER_TEMP/jvm" eu.senda.field.SendaFormatsTest
          java -cp "$RUNNER_TEMP/jvm" eu.senda.field.OfflineAssetsTest
      - name: "Buzón Bluetooth cercano: troceado y recompuesto de sobres (JVM)"
        run: |
          mkdir -p "$RUNNER_TEMP/jvm3"
          javac --release 17 -d "$RUNNER_TEMP/jvm3" apps/senda-android/app/src/main/java/eu/senda/field/MailboxFrames.java apps/senda-android/app/src/test/java/eu/senda/field/MailboxFramesTest.java
          java -cp "$RUNNER_TEMP/jvm3" eu.senda.field.MailboxFramesTest
      - name: "Enlaces que la app abre fuera (Waze, Maps, SMS): lista cerrada (JVM)"
        run: |
          mkdir -p "$RUNNER_TEMP/jvm4"
          javac --release 17 -d "$RUNNER_TEMP/jvm4" apps/senda-android/app/src/main/java/eu/senda/field/ExternalLinks.java apps/senda-android/app/src/test/java/eu/senda/field/ExternalLinksTest.java apps/senda-android/app/src/main/java/eu/senda/field/NetAllow.java apps/senda-android/app/src/test/java/eu/senda/field/NetAllowTest.java
          java -cp "$RUNNER_TEMP/jvm4" eu.senda.field.ExternalLinksTest
          java -cp "$RUNNER_TEMP/jvm4" eu.senda.field.NetAllowTest
      - name: Conformidad del arranque automático, puente Android Auto y USB-OTG mmWave (JVM)
        run: |
          mkdir -p "$RUNNER_TEMP/jvm2"
          javac --release 17 -d "$RUNNER_TEMP/jvm2" apps/senda-android/app/src/main/java/eu/senda/field/DriveAutostart.java apps/senda-android/app/src/test/java/eu/senda/field/DriveAutostartTest.java apps/senda-android/app/src/main/java/eu/senda/field/DriveHazards.java apps/senda-android/app/src/test/java/eu/senda/field/DriveHazardsTest.java apps/senda-android/app/src/main/java/eu/senda/field/UsbSerialCodec.java apps/senda-android/app/src/test/java/eu/senda/field/UsbSerialCodecTest.java
          java -cp "$RUNNER_TEMP/jvm2" eu.senda.field.DriveAutostartTest packages/senda/conformance/drive-autostart.vectors.txt
          java -cp "$RUNNER_TEMP/jvm2" eu.senda.field.DriveHazardsTest
          java -cp "$RUNNER_TEMP/jvm2" eu.senda.field.UsbSerialCodecTest
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar los APK base y play (prueba de compilación; la validación de radio y de arranque es en campo)
        working-directory: apps/senda-android
        run: gradle :app:assembleBaseDebug :app:assemblePlayDebug --no-daemon --stacktrace
      - run: test -s apps/senda-android/app/build/outputs/apk/base/debug/app-base-debug.apk && test -s apps/senda-android/app/build/outputs/apk/play/debug/app-play-debug.apk
      - name: La versión base no lleva Google Play Services ni permiso de Internet
        run: |
          APK=apps/senda-android/app/build/outputs/apk/base/debug/app-base-debug.apk
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$AAPT2" dump permissions "$APK" | tee "$RUNNER_TEMP/perms.txt"
          if grep -q "android.permission.INTERNET" "$RUNNER_TEMP/perms.txt"; then echo "la versión base no debe pedir INTERNET"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/dex" && unzip -q -o "$APK" 'classes*.dex' -d "$RUNNER_TEMP/dex"
          if grep -a -l "com/google/android/gms" "$RUNNER_TEMP"/dex/classes*.dex; then echo "la versión base no debe contener Google Play Services"; exit 1; fi
          "$AAPT2" dump permissions apps/senda-android/app/build/outputs/apk/play/debug/app-play-debug.apk | grep -q ACTIVITY_RECOGNITION
          "$AAPT2" dump permissions apps/senda-android/app/build/outputs/apk/play/debug/app-play-debug.apk | grep -q "android.permission.INTERNET"
          # Android Auto (Car App Library) solo en play; la base no debe declararlo
          "$AAPT2" dump xmltree --file AndroidManifest.xml apps/senda-android/app/build/outputs/apk/play/debug/app-play-debug.apk | grep -q "androidx.car.app.CarAppService"
          if "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q "androidx.car.app.CarAppService"; then echo "la base no debe declarar Android Auto"; exit 1; fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q "ScreenRecordService"  # caja negra: grabación de pantalla declarada
      - name: La app web va dentro del APK
        run: |
          L=$(unzip -l apps/senda-android/app/build/outputs/apk/base/debug/app-base-debug.apk)
          for f in assets/senda/save-file.mjs assets/senda/vendor/maplibre-gl-4.7.1/maplibre-gl-csp.js assets/senda/core/nav-osrm.mjs assets/senda/core/report-style.mjs assets/senda/conducir.html assets/senda/conducir.mjs assets/senda/core/drive-hazard.mjs assets/senda/vendor/models/efficientdet_lite0_int8.tflite assets/senda/vendor/mediapipe-tasks-vision-1.2.3/wasm/vision_wasm_internal.wasm assets/senda/core/hazard-verify.mjs assets/senda/core/hazard-share.mjs assets/senda/core/drive-corridor.mjs assets/senda/core/blackbox.mjs assets/senda/core/hazard-belief.mjs assets/senda/core/signal-radar.mjs assets/senda/core/map-style.mjs assets/senda/core/fire4d.mjs assets/senda/core/fire-science.mjs assets/senda/data/smv2026/fuel_100m.bin assets/senda/data/smv2026/burn_100m.bin assets/senda/core/geo-survey.mjs assets/senda/explorador.html assets/senda/explorador.mjs assets/senda/incendio4d.html assets/senda/incendio4d.mjs assets/senda/dana4d.html assets/senda/dana4d.mjs assets/senda/tren4d.html assets/senda/tren4d.mjs assets/senda/personas.html assets/senda/personas.mjs assets/senda/core/mmwave-radar.mjs assets/senda/core/rail-reconstruct.mjs assets/senda/data/adamuz2026/cronologia.json assets/senda/core/flood-science.mjs assets/senda/core/flood-warning.mjs assets/senda/core/heading-fusion.mjs assets/senda/core/hydro-estimates.mjs assets/senda/core/data-connectors.mjs assets/senda/data/dana2024/dem_d4.bin assets/senda/core/shallow-water.mjs assets/senda/data/dana2024/swe.json assets/senda/data/dana2024/swe_extension_frames.bin assets/senda/data/dana2024/telemetria.json assets/senda/data/dana2024/hand_roi.bin assets/senda/data/dana2024/dir_z12.bin assets/senda/data/dana2024/hidro.json assets/senda/data/smv2026/arrival_roi.bin assets/senda/data/smv2026/tci_d0808.jpg assets/senda/previews/map-termico.webp assets/senda/previews/conducir.webp assets/senda/previews/map-satelite.webp assets/senda/previews/senales.webp assets/senda/core/drive-blackbox.mjs assets/senda/core/drive-radars.mjs assets/senda/core/ndw-nl.mjs assets/senda/core/drive-ar-hud.mjs assets/senda/core/drive-kalman-fusion.mjs assets/senda/core/cits-denm.mjs assets/senda/core/traffic-shockwave.mjs assets/senda/core/hydro-surge-nl.mjs assets/senda/core/drive-field-lab.mjs assets/senda/core/drive-physics-v2.mjs assets/senda/core/ble-link-probe.mjs assets/senda/core/pmtiles-reader.mjs assets/senda/core/osint-feeds.mjs assets/senda/data/referencias/dgt_radares_oficiales.json assets/senda/data/referencias/nl_radares_oficiales.json assets/senda/data/referencias/nl_ndw_incidencias.json assets/senda/vendor/qrcode-generator-1.4.4.js assets/senda/vendor/jsqr-1.4.0.js assets/senda/ruta.html assets/senda/ruta.mjs assets/senda/core/route-planner.mjs assets/senda/core/voice-report.mjs assets/senda/app.html assets/senda/app-shell.mjs assets/senda/core/app-roles.mjs assets/senda/core/app-catalog.mjs assets/senda/index.html assets/senda/centro.html assets/senda/visor.html assets/senda/mensaje.html assets/senda/avisos.html assets/senda/core/courier.mjs assets/senda/core/hazard-reports.mjs assets/senda/core/envelope.mjs assets/senda/core/evidence-contract.mjs assets/senda/core/routing-canonical.mjs assets/senda/arr/arr-core.mjs assets/senda/atlas.html assets/senda/demo.html assets/senda/plataforma.html assets/senda/consola.html assets/senda/core/fusion.mjs assets/senda/vuelo.html assets/senda/mulas.html assets/senda/core/bus-mules.mjs assets/senda/aislamiento.html assets/senda/core/flood-isolation.mjs assets/senda/data/aislamiento/dana_horta_sud.json assets/senda/radio.html assets/senda/core/radio-planner.mjs assets/senda/data/radio/poyo.json assets/senda/agua-nl.html assets/senda/core/water-nl.mjs assets/senda/data/nl-water/rws_niveles.json assets/senda/data/mulas/conexiones.bin assets/senda/core/cross-source.mjs assets/senda/data/nepal2026/dem_60m.bin assets/senda/api/v1/catalog.json assets/senda/core/atlas.mjs assets/senda/data/referencias/goes_casos.json assets/geo/land-110m.json assets/senda/copiloto.html assets/senda/copiloto.mjs assets/senda/reportar.html assets/senda/reportar.mjs assets/senda/comite.html assets/senda/comite.mjs assets/senda/previews/copiloto.webp assets/senda/previews/reportar.webp assets/senda/previews/comite.webp assets/senda/core/drive-copilot-physics.mjs assets/senda/core/drive-community-calibration.mjs; do
            echo "$L" | grep -qF "$f" || { echo "falta $f en el APK"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: senda-android-debug-apk
          path: |
            apps/senda-android/app/build/outputs/apk/base/debug/app-base-debug.apk
            apps/senda-android/app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error
          retention-days: 30
