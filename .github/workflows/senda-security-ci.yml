name: SENDA Security (gitleaks + osv-scanner + pnpm audit)
permissions:
  contents: read

on:
  push:
    branches: [ master, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ master, 'feat/**', 'fix/**' ]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks (MIT, sin licencia de pago) y escanear working tree
        run: |
          GITLEAKS_VER="8.24.2"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-git --redact --exit-code 1

  dependency-audit:
    name: Vulnerabilidades (pnpm audit + osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          # Sin «cache: pnpm»: este job no instala dependencias (pnpm audit lee el lockfile) y la caché vacía hacía fallar el job.
      - name: Auditoría de dependencias de producción (cero críticos)
        run: |
          pnpm audit --prod --audit-level=critical
          (cd investor-next && npm audit --omit=dev --audit-level=high)
      - name: Escaneo OSV (osv-scanner Apache-2.0) sobre lockfiles
        run: |
          OSV_VER="2.0.1"
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/v${OSV_VER}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan --lockfile=pnpm-lock.yaml --lockfile=investor-next/package-lock.json --format=json > /tmp/osv-report.json || true
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync("/tmp/osv-report.json", "utf8"));
            const critical = [];
            for (const res of r.results ?? []) {
              for (const pkg of res.packages ?? []) {
                for (const v of pkg.vulnerabilities ?? []) {
                  const sev = String(v.database_specific?.severity ?? "").toUpperCase();
                  if (sev === "CRITICAL") critical.push({ pkg: pkg.package?.name, id: v.id, sev });
                }
              }
            }
            console.log("OSV critical count:", critical.length);
            if (critical.length > 0) { console.error(critical); process.exit(1); }
          '
      - name: Pruebas de endurecimiento de seguridad (CSP, NetAllow, N5)
        run: |
          node --test packages/senda/tests/security-hardening.test.mjs
          mkdir -p "$RUNNER_TEMP/netallow"
          javac --release 17 -d "$RUNNER_TEMP/netallow" apps/senda-android/app/src/main/java/eu/senda/field/NetAllow.java apps/senda-android/app/src/test/java/eu/senda/field/NetAllowTest.java
          java -cp "$RUNNER_TEMP/netallow" eu.senda.field.NetAllowTest
