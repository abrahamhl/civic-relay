name: SENDA iOS (compilación y conformidad)
on:
  push:
    branches: [master]
    paths: ['apps/senda-ios/**', 'packages/senda/conformance/**', '.github/workflows/senda-ios-ci.yml']
  pull_request:
    paths: ['apps/senda-ios/**', 'packages/senda/conformance/**', '.github/workflows/senda-ios-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    name: Simulador iOS · DriveAutostart conforme con la referencia
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generar el proyecto
        run: |
          brew install xcodegen
          cd apps/senda-ios && xcodegen generate
      - name: Elegir un simulador de iPhone disponible
        id: sim
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Compilar y probar
        working-directory: apps/senda-ios
        run: xcodebuild test -project SendaDrive.xcodeproj -scheme SendaDrive -destination "id=${{ steps.sim.outputs.id }}" CODE_SIGNING_ALLOWED=NO | tail -60; exit ${PIPESTATUS[0]}
      - name: La app web va dentro de la app
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphonesimulator/SendaDrive.app' -type d | head -1)
          test -f "$APP/web/senda/index.html" && test -f "$APP/web/senda/core/drive-autostart.mjs"
