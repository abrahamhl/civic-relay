name: SENDA Android (publicar APK)
# En cada fusión a master compila los APK base y play y los publica en la Release fija
# «senda-android-latest» (prerelease) con su SHA-256. Firma de PRUEBAS DE CAMPO (no sirve para tiendas).
on:
  push:
    branches: [master]
    paths: ['apps/senda-android/**', 'investor-next/public/senda/**', 'investor-next/public/geo/**', '.github/workflows/senda-android-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: senda-android-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
        with: { packages: 'platform-tools', log-accepted-android-sdk-licenses: 'false' }
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Compilar base y play
        working-directory: apps/senda-android
        run: gradle :app:assembleBaseDebug :app:assemblePlayDebug --no-daemon --stacktrace
      - name: Reunir archivos, sumas y comprobar la firma
        run: |
          mkdir -p out
          cp apps/senda-android/app/build/outputs/apk/base/debug/app-base-debug.apk out/senda-base.apk
          cp apps/senda-android/app/build/outputs/apk/play/debug/app-play-debug.apk out/senda-play.apk
          (cd out && sha256sum senda-base.apk senda-play.apk | tee SHA256SUMS.txt)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/senda-base.apk | head -3
      - name: Publicar en la Release fija
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          {
            echo "Versión de pruebas de campo (firma de pruebas, no certificada). Código: \`$GITHUB_SHA\`"
            echo; echo "Compilada: $(date -u +%Y-%m-%dT%H:%MZ)"; echo; echo "SHA-256:"; echo '```'; cat out/SHA256SUMS.txt; echo '```'
            echo; echo "Instalar: https://civic-relay-investor.vercel.app/senda/descargas (o abrir senda-base.apk en el móvil)."
          } > notes.md
          gh release delete senda-android-latest --cleanup-tag --yes || true
          gh release create senda-android-latest out/senda-base.apk out/senda-play.apk out/SHA256SUMS.txt \
            --prerelease --target "$GITHUB_SHA" --title "SENDA Android · última versión ($SHORT)" --notes-file notes.md
