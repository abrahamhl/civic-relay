name: SENDA v0.21 Evidence Quality
on:
  push:
    branches:
      - research/senda-v021-evidence-quality-20261106
  pull_request:
    branches:
      - ccr-357397d4-i6q247
permissions:
  contents: read
jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax for science pipeline
        run: |
          node --check packages/senda/src/observation-quality.mjs
          node --check packages/senda/scripts/referencias-real.mjs
      - name: Quality gate and all core regression tests
        run: node --test packages/senda/tests/*.test.mjs packages/senda/tests/defense/*.test.mjs
      - name: Python camera-flow syntax (without network or inference)
        run: python3 -m py_compile packages/senda-vision/camera_flow.py
      - name: SQLite normalized evidence registry tests (offline)
        run: |
          python3 -m unittest discover -s packages/senda/data -p 'test_*.py' -v
          python3 packages/senda/data/build_source_db.py --db /tmp/senda-sources-evidence.sqlite
      - name: Assert the official catalog is only documentation-checked
        run: |
          node --input-type=module -e "import r from './packages/senda/data/source-registry.v021.json' with {type:'json'}; if(r.sources.length<10 || !r.sources.every(s=>s.status==='OFFICIAL_DOCUMENTATION_CHECKED')) process.exit(1)"
      - name: Populate SQLite with 2026 genuine recorded TfL-Caltrans detector observations
        run: |
          mkdir -p "$RUNNER_TEMP/senda-real"
          python3 packages/senda/data/ingest_recorded_real_cameras.py --db "$RUNNER_TEMP/senda-real/evidence.sqlite" | tee "$RUNNER_TEMP/senda-real/recorded-camera-summary.json"
      - name: Ingest authentic NOAA archived fire pixels and historical HRRR forecast values
        run: |
          set -euo pipefail
          python3 packages/senda/data/ingest_real_goes_hrrr_archive.py --db "$RUNNER_TEMP/senda-real/evidence.sqlite" | tee "$RUNNER_TEMP/senda-real/noaa-archive-summary.json"
      - name: Query one actual public Fintraffic physical road detector (no credentials)
        run: |
          set -euo pipefail
          python3 packages/senda/data/fetch_real_digitraffic_tms.py --station 23001 --out "$RUNNER_TEMP/senda-real" | tee "$RUNNER_TEMP/senda-real/physical-tms-summary.json"
          python3 packages/senda/data/ingest_digitraffic_snapshot.py --station 23001 --db "$RUNNER_TEMP/senda-real/evidence.sqlite" --snapshot-dir "$RUNNER_TEMP/senda-real" | tee "$RUNNER_TEMP/senda-real/composed-sqlite-summary.json"
      - name: Validate physical data + source hashes + no incident decision permissions
        if: success()
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,sqlite3
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"senda-real"
          val=json.loads((root/"digitraffic_tms_23001.normalized.json").read_text())
          raw=(root/val["raw_filename"]).read_bytes()
          assert hashlib.sha256(raw).hexdigest()==val["raw_sha256"]
          assert val["number_of_numeric_readings"]>0
          assert val["source_id"]=="digitraffic_tms"
          with sqlite3.connect(root/"evidence.sqlite") as db:
              assert db.execute("select count(*) from observations where source_quality_code='REAL_VIDEO_MODEL_DERIVED_UNVERIFIED'").fetchone()[0]==57
              assert db.execute("select count(*) from observations where source_quality_code='REAL_SATELLITE_PIXEL_MASK_LOST_NO_CALIBRATION'").fetchone()[0]==13116
              assert db.execute("select count(*) from observations where source_quality_code='REAL_NOAA_ARCHIVED_FORECAST_ISSUE_TIME_MISSING'").fetchone()[0]==535
              assert db.execute("select count(*) from observations where source_quality_code='REAL_PHYSICAL_SENSOR_RESEARCH_UNCALIBRATED'").fetchone()[0]>0
              assert db.execute("select count(*) from observations where allow_model_fusion=1").fetchone()[0]==0
          print("Evidence provenance verified; zero emergency approvals.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senda-real-observations-evidence
          path: ${{ runner.temp }}/senda-real/
          if-no-files-found: warn
          retention-days: 14
