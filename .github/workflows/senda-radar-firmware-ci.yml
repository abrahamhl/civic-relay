name: SENDA Radar v1 Firmware (host g++ + ESP32-S3)
permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - 'hardware/modules/senda-radar/firmware/**'
      - '.github/workflows/senda-radar-firmware-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'hardware/modules/senda-radar/firmware/**'
      - '.github/workflows/senda-radar-firmware-ci.yml'
  workflow_dispatch:

jobs:
  firmware:
    name: Pruebas C++17 en host + compilación XIAO ESP32-S3 (arduino-cli)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Probar lógica desacoplada en el host (mismas tramas que mmwave-radar.test.mjs)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I hardware/modules/senda-radar/firmware \
            hardware/modules/senda-radar/firmware/test/host_test.cpp \
            -o /tmp/senda_radar_host_test
          /tmp/senda_radar_host_test
          bytes=$(/tmp/senda_radar_host_test --smoke-stream | wc -c)
          echo "Flujo binario --smoke-stream verificado (${bytes} caracteres hex)"
          test "$bytes" -ge 2000

      - name: Instalar pyserial requerido por esptool.py en Ubuntu
        run: |
          python3 -m pip install --user pyserial || python3 -m pip install --break-system-packages pyserial || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-serial)

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino ESP32 core 3.0.7
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages/esp32
            ~/.arduino15/staging
          key: ${{ runner.os }}-arduino-esp32-3.0.7

      - name: Instalar núcleo ESP32 3.0.7 (release oficial de Espressif)
        env:
          URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        run: |
          arduino-cli core update-index --additional-urls "$URL"
          if ! arduino-cli core list | grep -q "esp32:esp32"; then
            installed=0
            for i in 1 2 3 4 5; do
              echo "Intento $i de instalar esp32:esp32@3.0.7..."
              if arduino-cli core install esp32:esp32@3.0.7 --additional-urls "$URL"; then
                installed=1
                break
              fi
              sleep 20
            done
            if [ "$installed" -ne 1 ]; then
              echo "ERROR: no se pudo instalar esp32:esp32@3.0.7 tras 5 intentos."
              exit 1
            fi
          fi

      - name: Compilar firmware SENDA Radar v1 (Seeed XIAO ESP32-S3, USB-CDC nativo)
        run: |
          mkdir -p /tmp/senda-radar-fw-out
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32S3 \
            --warnings all \
            --output-dir /tmp/senda-radar-fw-out \
            hardware/modules/senda-radar/firmware
          cd /tmp/senda-radar-fw-out
          sha256sum firmware.ino.bin firmware.ino.bootloader.bin firmware.ino.partitions.bin firmware.ino.merged.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Subir binario compilado y SHA-256 como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: senda-radar-v1-esp32s3-firmware
          path: |
            /tmp/senda-radar-fw-out/firmware.ino.bin
            /tmp/senda-radar-fw-out/firmware.ino.bootloader.bin
            /tmp/senda-radar-fw-out/firmware.ino.partitions.bin
            /tmp/senda-radar-fw-out/firmware.ino.merged.bin
            /tmp/senda-radar-fw-out/SHA256SUMS.txt
          retention-days: 30
