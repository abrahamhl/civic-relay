name: Android Nearby laboratory (build-only)
on:
  push:
    branches: [feat/master-emergency-routing-v1-20261020]
    paths:
      - 'experimental/android-nearby/**'
      - '.github/workflows/android-nearby-ci.yml'
  pull_request:
    paths:
      - 'experimental/android-nearby/**'
      - '.github/workflows/android-nearby-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-build:
    name: Compile experimental two-phone APK (not physical validation)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK without deprecated tools package
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit test pure JVM message guard (without Android radio)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/oep-jvm"
          javac --release 17 -d "$RUNNER_TEMP/oep-jvm" \
            experimental/android-nearby/app/src/main/java/eu/civicrelay/nearbylab/LabDeliveryGuard.java \
            experimental/android-nearby/app/src/test/java/eu/civicrelay/nearbylab/LabDeliveryGuardTest.java \
            experimental/android-nearby/app/src/main/java/eu/civicrelay/nearbylab/LabTrialJournal.java \
            experimental/android-nearby/app/src/test/java/eu/civicrelay/nearbylab/LabTrialJournalTest.java
          java -cp "$RUNNER_TEMP/oep-jvm" eu.civicrelay.nearbylab.LabDeliveryGuardTest
          java -cp "$RUNNER_TEMP/oep-jvm" eu.civicrelay.nearbylab.LabTrialJournalTest
      - name: Compile debug APK without connecting to emergency services
        working-directory: experimental/android-nearby
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Confirm APK produced (build proof ONLY)
        run: test -s experimental/android-nearby/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish short-lived consented research APK (not for real emergencies)
        uses: actions/upload-artifact@v4
        with:
          name: oep-two-phone-lab-debug-apk
          path: experimental/android-nearby/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

