name: SENDA LIVE · NASA/USGS geospatial evidence maps
on:
  push:
    branches:
      - 'feat/senda-usgs-map-evidence-*'
  pull_request:
    branches:
      - 'feat/senda-social-live-*'
      - master
  workflow_dispatch:
permissions:
  contents: read
jobs:
  usgs-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline deterministic upstream adapter tests
        run: node --test apps/senda-live/tests/usgs-earthquakes.test.mjs apps/senda-live/tests/eonet-wildfires.test.mjs
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: SENDA LIVE API and feature tests
        run: corepack pnpm --filter @senda/live test
      - name: Web type checks
        run: corepack pnpm --filter @senda/live type-check
      - name: Vite production build
        run: corepack pnpm --filter @senda/live build
      - name: Optional live NASA EONET research receipt
        continue-on-error: true
        run: node apps/senda-live/scripts/capture-eonet-research.mjs
      - name: Archive NASA catalog acquisition receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senda-eonet-catalog-research
          path: evidence/senda/eonet/latest-catalog-acquisition.json
          if-no-files-found: warn
          retention-days: 14
