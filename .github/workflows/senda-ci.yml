name: SENDA
permissions:
  contents: read
on:
  push:
    branches: [ master, fix/senda-dtn-receipt-quarantine-20261107 ]
  pull_request:
    branches: [ master, fix/senda-dtn-receipt-quarantine-20261107, feat/senda-funding-mission-day1 ]
  workflow_dispatch:
jobs:
  senda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Núcleo SENDA (cifrado, módem acústico, DTN, enrutador, zonas, rescate)
        run: node --test packages/senda/tests/*.test.mjs packages/senda/tests/defense/*.test.mjs
      - name: Relé por Internet (Node, sin dependencias)
        run: node --test packages/senda-relay/tests/*.test.mjs
      - name: Imagen Docker del relé (construye, arranca sin privilegios, sincroniza y persiste)
        run: |
          docker build -f packages/senda-relay/Dockerfile -t senda-relay .
          docker run -d --name relay -p 8787:8787 -v senda-data:/data senda-relay
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/health && break; sleep 1; done
          curl -fsS -X POST -H 'content-type: application/json' -d '{"summary":{"owner":"ci","ids":[],"receipts":[],"broadcasts":[]},"envelopes":[],"receipts":[],"broadcasts":[]}' http://127.0.0.1:8787/sync
          sleep 6 && docker exec relay test -s /data/store.json && docker logs relay
      - name: Paridad de formatos web / Android (JVM) / ESP32 (C++)
        run: |
          mkdir -p "$RUNNER_TEMP/senda-jvm"
          javac --release 17 -d "$RUNNER_TEMP/senda-jvm" apps/senda-android/app/src/main/java/eu/senda/field/SendaFormats.java apps/senda-android/app/src/main/java/eu/senda/field/NativeAction.java apps/senda-android/app/src/test/java/eu/senda/field/SendaFormatsTest.java
          java -cp "$RUNNER_TEMP/senda-jvm" eu.senda.field.SendaFormatsTest
          g++ -std=c++17 -Wall -Wextra -Werror -I hardware/esp32-survey hardware/esp32-survey/test/host_test.cpp -o "$RUNNER_TEMP/senda-frame" && "$RUNNER_TEMP/senda-frame"
      - name: Escenarios de referencia
        run: node packages/senda/scripts/run-scenarios.mjs
      - name: Chromium para la prueba sin red
        run: npx --yes playwright@1.63.0 install --with-deps chromium && npm i --no-save --prefix /tmp/pw playwright@1.63.0
      - name: App SENDA Campo extremo a extremo con la red cortada
        run: NODE_PATH=/tmp/pw/node_modules node investor-next/scripts/senda-offline-e2e.mjs
      - name: Pantallas Mensaje, Avisos y cola del Centro (varios móviles en Chromium)
        run: NODE_PATH=/tmp/pw/node_modules node investor-next/scripts/senda-screens-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senda-evidence
          path: evidence/senda/
      - name: Verificación del despliegue público (solo en master)
        if: github.ref == 'refs/heads/master'
        run: SENDA_BASE_URL=https://civic-relay-investor.vercel.app/senda NODE_PATH=/tmp/pw/node_modules node investor-next/scripts/senda-offline-e2e.mjs
  senda-adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trilateracion, sobre cifrado y DTN adversarial
        run: node --test packages/senda/tests-adversarial/*.test.mjs
  senda-pci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cadena de custodia PCI
        run: node --test packages/senda-pci/tests/*.test.mjs
      - name: PCI adversarial y canonicalizacion
        run: node --test packages/senda-pci/tests-adversarial/*.test.mjs
  release-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Manifiesto fuente-build-artefacto
        run: node --test scripts/release-manifest.test.mjs scripts/vercel-provenance.test.mjs
