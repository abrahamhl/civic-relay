name: CI
permissions:
  contents: read

on:
  push:
    branches: [ master, 'mission/**', 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ master, 'mission/**', 'feat/**', 'fix/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Presupuesto F1: CI completo < 10 min y protección dura contra pruebas colgadas (Node 22 y 24).
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Enable Corepack
      run: corepack enable

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Type check
      run: pnpm type-check

    - name: Run tests
      run: pnpm test

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          packages/*/dist
          apps/web/dist

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Enable Corepack
      run: corepack enable
    - name: Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Measure c8 coverage (≥ 90 % calculation modules)
      run: node packages/senda/scripts/run-coverage-f2.mjs
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: senda-coverage-report
        path: evidence/quality/coverage-report.json
