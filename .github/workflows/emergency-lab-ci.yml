name: Emergency routing research lab
permissions:
  contents: read
on:
  push:
    branches: [feat/master-emergency-routing-v1-20261020, master]
    paths:
      - 'investor-next/**'
      - 'docs/**'
      - '.github/workflows/emergency-lab-ci.yml'
  pull_request:
    paths:
      - 'investor-next/**'
      - 'docs/**'
      - '.github/workflows/emergency-lab-ci.yml'
jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic model invariants
        run: node --test investor-next/tests/*.test.mjs
      - name: Generate independently reproducible synthetic research evidence
        run: node investor-next/scripts/oep-evidence-run.mjs --out evidence/oep-virtual-scenario-report.json
      - name: Publish simulation evidence (NOT physical testing)
        uses: actions/upload-artifact@v4
        with:
          name: oep-synthetic-evidence
          path: evidence/oep-virtual-scenario-report.json
          retention-days: 30
          if-no-files-found: error
      - name: Install investor dependencies
        working-directory: investor-next
        run: npm install --no-audit --no-fund
      - name: Strict Next.js TypeScript validation
        working-directory: investor-next
        run: npm run type-check
      - name: Build investor experience (preserve Three.js)
        working-directory: investor-next
        run: npm run build
      - name: Translation markup smoke
        working-directory: investor-next
        run: npm run check:locales
