<script>

function badgeHTML(sc) {
  const ck = sc.claim || (sc.visual?.kind === 'page' || sc.visual?.kind === 'drone3d' ? 'SIMULATED' : 'CALCULATED');

  if (sc.visual?.kind === 'page' && sc.visual.src) {

    if (vn) out += `<span class="claim-badge sim">${LANG === 'en' ? vn.en : vn.es}</span>`;
  }
  return `<div class="badges">${out}</div>`;

function sceneInSlice(idx) {
  const s = TL?.scenes?.[idx];
  if (!s) return true;
  return !(s.end < T0 - 1.0 || s.start > T1 + 1.0);
}

function visualHTML(sc, idx) {

    <div class="dg-row d3"><div class="dg-card"><b class="dg-num">1149/1149</b><span>times “≥98 %” was right · 200 simulations</span></div><div class="dg-card"><b>Margin</b><span>always reported with the estimate</span></div></div>`,
    'Only a probability. Never a guess dressed as fact.');
  if (v.kind === 'railwatch') return dg('Track circuit · its own history', 'simulation · synthetic', 'The signal was in the data, 21.5 hours early.',
    `<svg class="rail-chart d2" viewBox="0 0 580 230" aria-hidden="true"><g stroke="#16242e" stroke-width="1"><line x1="44" y1="20" x2="44" y2="190"/><line x1="44" y1="190" x2="556" y2="190"/></g><line x1="44" y1="130" x2="556" y2="130" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 5"/><text x="50" y="124" fill="#fbbf24" font-size="10" font-family="ui-monospace,monospace">absolute threshold</text><path d="M44 60 L300 60 L300 95 L450 95 L450 180 L556 180" fill="none" stroke="#91d7e8" stroke-width="3"/><circle cx="300" cy="95" r="4" fill="#ff7756"/><text x="308" y="90" fill="#ff7756" font-size="10" font-family="ui-monospace,monospace">drop · no alarm</text><line x1="300" y1="40" x2="450" y2="40" stroke="#ff7756" stroke-dasharray="4 4"/><text x="310" y="34" fill="#ff7756" font-size="10" font-family="ui-monospace,monospace">21.5 h of lead time</text><text x="455" y="174" fill="#fbbf24" font-size="10" font-family="ui-monospace,monospace">step</text><text x="50" y="28" fill="#a9bcc5" font-size="10" font-family="ui-monospace,monospace">circuit voltage</text><text x="492" y="210" fill="#7d8f99" font-size="9" font-family="ui-monospace,monospace">time →</text></svg>
    <div class="rail-legend d3"><span class="lg"><i class="v"></i>circuit voltage</span><span class="lg"><i class="t"></i>absolute threshold</span><span class="lg"><i class="d"></i>drop · no alarm</span></div>
    <div class="dg-row d3"><div class="dg-card"><b class="dg-num">0</b><span>absolute-threshold alarms</span></div><div class="dg-card"><b class="dg-num">21.5 h</b><span>lead time on the step</span></div><div class="dg-card"><b>Inspection</b><span>proposed from relative history</span></div></div>`,
    'Adds phone geometry, curves without supervision, walls under rain.');
  if (v.kind === 'fire') return dg('Wildfire · warn before the mast burns', 'simulation', 'The alert has to leave before the mast does.',
    `<div class="fire-grid d2">
      <svg class="fire-map" viewBox="0 0 300 300" aria-hidden="true"><rect width="300" height="300" fill="#071018"/><g stroke="#16242e" stroke-width="1" opacity=".65"><path d="M0 60 H300 M0 120 H300 M0 180 H300 M0 240 H300 M60 0 V300 M120 0 V300 M180 0 V300 M240 0 V300"/></g><path d="M40 240 C60 180 90 170 120 160 C150 150 160 120 190 110 C220 100 240 70 270 60 L290 120 C260 150 240 180 220 210 C190 250 140 270 90 280 Z" fill="rgba(255,119,86,.16)" stroke="#ff7756" stroke-width="2"/><path d="M70 230 C90 195 110 185 135 175 C160 165 175 140 200 130 C220 122 235 100 255 92 L265 130 C240 160 225 185 205 210 C180 240 145 250 110 255 Z" fill="rgba(255,119,86,.24)" stroke="#ff9a86" stroke-width="2"/><path d="M105 220 C120 200 135 190 155 182 C175 174 188 158 205 150 L215 175 C195 200 185 218 170 232 C150 248 130 250 115 248 Z" fill="rgba(251,191,36,.28)" stroke="#fbbf24" stroke-width="2"/><path d="M250 100 C235 115 230 125 232 138" fill="none" stroke="#91d7e8" stroke-width="3"/><polygon points="232,138 226,130 238,130" fill="#91d7e8"/><g transform="translate(232,200)"><rect x="-4" y="-26" width="8" height="52" fill="#a9bcc5"/><circle cx="0" cy="-30" r="6" fill="#ff7756"/><path d="M-14 -26 H14" stroke="#a9bcc5" stroke-width="2"/></g><circle cx="268" cy="242" r="6" fill="#91d7e8"/><text x="276" y="246" fill="#91d7e8" font-size="9" font-family="ui-monospace,monospace">town</text><text x="12" y="20" fill="#a9bcc5" font-size="9" font-family="ui-monospace,monospace">fire spread + wind + slope</text></svg>
      <div class="fire-right"><div class="fire-kpi"><b>107 min</b><span>between losing the mast and the warning deadline</span></div><div class="fire-timeline"><div class="ft-row"><i class="dot"></i><b>Mast burns</b><span>t + 0</span></div><div class="ft-row"><i class="dot warn"></i><b>Warning deadline</b><span>t + 107 min</span></div></div><div class="fire-channels"><span>Neighbours</span><span>LoRa</span><span>Satellite</span></div></div>
    </div>`,
    'Fire spread × wind × slope, crossed with the mast network.', 'warn');
  if (v.kind === 'trust') return dg('Signed alert · consent · zone', 'calculated', 'Nothing happens on your phone without all three.',
    `<div class="trust-grid d2">
      <div class="alert-phone"><div class="ap-top"><span>EMERGENCY ALERT</span><span class="pill red">LIVE</span></div><div class="ap-body"><b>Fire Service · pilot</b><span>Credential signed by the agency</span><div class="ap-checks"><span>✓ You authorised it</span><span>✓ Emergency declared</span><span>✓ Zone: B14 · floors 1–4</span></div><div class="ap-q">Are you all right?</div><div class="ap-btns"><span class="safe">I’m safe</span><span class="help">I need help</span><span class="trap">I’m trapped</span></div></div></div>
      <div class="board"><div class="board-head"><b>Coordinator board</b><span>live</span></div><div class="b-row"><span>Floor 4</span><b class="trap">2 trapped</b><em>1 safe</em></div><div class="b-row"><span>Floor 3</span><b class="help">1 needs help</b><em>4 safe</em></div><div class="b-row"><span>Floor 2</span><b>3 unconfirmed</b><em>—</em></div><div class="b-row"><span>Floor 1</span><b class="safe">5 safe</b><em>—</em></div><div class="board-foot">Encrypted reply · neighbour to neighbour</div></div>
    </div>`,
    'A credential from the agency. Your consent. A declared emergency.');
  if (v.kind === 'easy') return dg('Easy mode · three buttons', 'observed', 'No menus. No reading. One tap.',
    `<div class="easy-btns d2"><div class="easy safe"><b>I’m safe</b><span>Tell your contacts you are okay.</span></div><div class="easy help"><b>I need help</b><span>Send your floor and status.</span></div><div class="easy trap"><b>I’m trapped</b><span>Alert rescue with your location.</span></div></div>
    <div class="easy-foot d3"><b>✓</b> Automated accessibility check on every change.</div>`,
    'Three big buttons. Nothing else in the way.');
  if (v.kind === 'cta') {
    const l = L[LANG] ?? L.en;
    return `<div><div class="chips">${l.who.map((w, i) => `<span class="chip w${i}">${w}</span>`).join('')}</div><div class="url">civic-relay-investor.vercel.app/senda</div><div class="copyright">© 2026 Abraham Haddioui · SENDA · MIT License · 112 first</div></div>`;
  }
  return '';
}

function build() {
  const stage = document.getElementById('stage');
  const head = (sc, i) => `<div><div class="eyebrow">SENDA · ${String(i + 1).padStart(2, '0')} / ${String(SCRIPT.scenes.length).padStart(2, '0')}</div>${badgeHTML(sc)}<h1>${T(sc.title).split(' ').map((w) => `<span>${w}</span>`).join('')}</h1></div>`;
  stage.innerHTML = SCRIPT.scenes.map((sc, i) => SIMS.full(sc.visual.kind)
    ? `<section class="scene full" id="sc-${i}"><div class="slot"></div><div class="shade"></div>${head(sc, i)}<div></div><div class="hud"></div></section>`
    : `<section class="scene" id="sc-${i}">${head(sc, i)}<div class="vis">${visualHTML(sc, i)}</div></section>`).join('');
  scenesEl = SCRIPT.scenes.map((_, i) => document.getElementById('sc-' + i));
}

function drawBg(t) {
  const c = document.getElementById('bg');
  const W = VERTICAL ? 720 : 1280, H = VERTICAL ? 1280 : 720;
  const g = c.getContext('2d');
  g.fillStyle = '#05090c'; g.fillRect(0, 0, W, H);
  const grd = g.createRadialGradient(W * 0.76, H * 0.5, 40, W * 0.76, H * 0.5, 700);
  grd.addColorStop(0, 'rgba(255,119,86,.10)'); grd.addColorStop(1, 'rgba(5,9,12,0)');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(145,215,232,.22)';
  for (let i = 0; i < 90; i++) {
    const x = (i * 137.5 + t * (6 + (i % 5))) % (W + 20) - 10;
    const y = (i * 71.3 + Math.sin(t * 0.3 + i) * 8) % H;
    g.fillRect(x, y, 2, 2);
  }
}

window.seek = (t) => {
  drawBg(t);
  document.getElementById('prog').style.width = (100 * t / TL.duration) + '%';
  let activeSub = '';
  TL.scenes.forEach((s, i) => {
    const el = scenesEl[i]; const lt = t - s.start, d = s.end - s.start;
    const vis = lt >= -0.01 && lt < d;
    if (!vis) {
      if (el.style.display !== 'none') el.style.display = 'none';
      return;
    }
    if (el.style.display !== 'grid') el.style.display = 'grid';
    const fade = Math.min(ease(lt / 0.6), ease((d - lt) / 0.5));
    el.style.opacity = fade;
    if (BURNSUB && s.lines) {
      const subArr = SCRIPT.scenes[i][BURNSUB] || SCRIPT.scenes[i].en || [];
      for (let j = 0; j < s.lines.length; j++) {
        const ln = s.lines[j];
        if (t >= ln.start - 0.05 && t <= ln.end + 0.35) { activeSub = subArr[j] || ln.text || ''; break; }
      }
    }
    el.querySelectorAll('h1 span').forEach((w, j) => { const p = ease((lt - 0.15 - j * 0.07) / 0.5); w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 18}px)`; });
    const cue = (n) => s.cues[n] ?? s.cues[s.cues.length - 1] ?? 0;
    const appear = (sel, at, dy = 26) => el.querySelectorAll(sel).forEach((x) => { const p = ease((lt - at) / 0.7); x.style.opacity = p; x.style.transform = `translateY(${(1 - p) * dy}px) scale(${0.97 + 0.03 * p})`; });
    for (let k = 0; k < 6; k++) {
      const kind = SCRIPT.scenes[i].visual.kind;
      const kAt = (kind === 'kpis' || kind === 'verify')
        ? (0.35 + k * 0.55)
        : (cue(Math.min(k + (kind === 'shots' ? 1 : 0), s.cues.length - 1)) + 0.3 + k * 0.6);
      appear(`.k${k}`, kAt);
      appear(`.s${k}`, 0.35 + k * 0.7);
      appear(`.w${k}`, 0.25 + k * 0.22);
      appear(`.f${k}`, 0.3 + k * 0.5, 40);
      appear(`.d${k}`, 0.2 + k * 0.5, 20);
    }
    el.querySelectorAll('.f0 img,.f1 img').forEach((im) => { const z = 1 + 0.04 * clamp(lt / d); im.style.transformOrigin = '50% 0'; im.style.transform = `scale(${z})`; });
    const slt = Math.max(0, lt);
    SIMS.draw(SCRIPT.scenes[i].visual.kind, el, slt, d, cue);
    const pg = el.querySelector('iframe.pg'); if (pg) pg.contentWindow?.SENDA_VIZ?.seek(Math.max(0, slt - 0.3));
    const url = el.querySelector('.url'); if (url) { const p = ease((slt - Math.min(1.5, cue(1))) / 0.7); url.style.opacity = p; }
    const hub = el.querySelector('.hub');
    if (hub) {
      const nodes = [...hub.querySelectorAll('.node:not(.core)')]; const svg = hub.querySelector('svg');
      let lines = '';
      nodes.forEach((n, j) => { const at = cue(1) + j * 0.55; const p = ease((slt - at) / 0.5); n.style.opacity = 0.15 + 0.85 * p; const x = parseFloat(n.style.left), y = parseFloat(n.style.top);
        if (p > 0) { const ph = ((slt * 0.8 + j * 0.13) % 1); lines += `<line x1="320" y1="300" x2="${x}" y2="${y}" stroke="rgba(145,215,232,${0.35 * p})" stroke-width="2"/><circle cx="${x + (320 - x) * ph}" cy="${y + (300 - y) * ph}" r="5" fill="#ff7756" opacity="${p}"/>`; } });
      svg.innerHTML = lines;
    }
  });
  if (BURNSUB) {
    const subEl = document.getElementById('sub-txt');
    subEl.textContent = activeSub;
    subEl.style.display = activeSub ? 'inline-block' : 'none';
  }
};

(async () => {
  SCRIPT = await (await fetch(`${SCRIPT_NAME}.json`)).json();
  let tlData = null;
  try {
    const r = await fetch(`build/timings-${SCRIPT_NAME}-${LANG}.json`);
    if (r.ok) {
      const j = await r.json();
      tlData = {
        duration: j.totalDuration,
        scenes: j.scenes.map((s) => ({
          id: s.id,
          start: s.start,
          end: s.end,
          lines: s.lines || [],
          cues: (s.lines || []).map((l) => +(l.start - s.start).toFixed(3)),
        })),
      };
    }
  } catch {}
  if (!tlData) {
    await new Promise((res) => { const s = document.createElement('script'); s.src = `out/timeline-${PFX}${LANG}.js`; s.onload = res; document.head.appendChild(s); });
    tlData = window.TIMELINE;
  }
  TL = tlData; window.TIMELINE = TL; window.DURATION = TL.duration;
  document.documentElement.lang = LANG;
  window.__NEED_DRONE = SCRIPT.scenes.some((sc, i) => sceneInSlice(i) && sc.visual?.kind === 'drone3d');
  window.__NEED_ARCH = SCRIPT.scenes.some((sc, i) => sceneInSlice(i) && sc.visual?.kind === 'arch3d');
  build();
  await SIMS.init();
  SCRIPT.scenes.forEach((sc, i) => {
    if (!sceneInSlice(i)) return;
    const c = SIMS.canvasFor(sc.visual.kind);
    if (c) scenesEl[i].querySelector('.slot').appendChild(c);
  });
  await Promise.all([...document.querySelectorAll('iframe.pg')].map((f) => new Promise((ok) => { const chk = () => (f.contentWindow?.SENDA_VIZ_READY ? ok() : setTimeout(chk, 50)); chk(); })));
  await Promise.all([...document.images].map((im) => (im.complete ? 1 : new Promise((r) => { im.onload = im.onerror = r; }))));
  window.seek(+(Q.get('t') || (Q.has('t0') ? +Q.get('t0') : 0)));
  window.READY = true;
})();
</script>
