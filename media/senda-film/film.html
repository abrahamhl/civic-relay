<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SENDA · película M95</title>
<script src="/senda/vendor/three-0.158.0.min.js"></script>
<script src="sims.js"></script>
<!--
  Película SENDA v5 / M95 · 1280×720 @ 1.5x DPR (1920×1080) o 720×1280 @ 1.5x DPR (1080×1920 vertical).
  Escenas «call», «drone3d», «arch3d» y «howsim» calculadas con el núcleo real (sims.js).
  Determinista: window.seek(t) fija cada fotograma (sin temporizadores).
-->
<style>
:root{--bg:#05090c;--p:#0b141c;--l:#203240;--t:#f2f4f4;--m:#a9bcc5;--c:#ff7756;--i:#91d7e8;--e:#34d399;--a:#fbbf24;--r:#ff5b6e}
*{box-sizing:border-box}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body.vertical{width:720px;height:1280px}
#bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scene{position:absolute;inset:0;padding:56px 64px;display:none;grid-template-columns:470px 1fr;gap:44px;align-items:center;opacity:0;pointer-events:none}
body.vertical .scene{padding:56px 40px 160px;grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:28px;align-items:center}
.eyebrow{font:600 13px ui-monospace,monospace;letter-spacing:.18em;color:var(--c);text-transform:uppercase;margin-bottom:10px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.claim-badge{font:700 11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(11,20,28,.9);border:1px solid rgba(145,215,232,.4);color:var(--i)}
.claim-badge.sim{border-color:rgba(251,191,36,.5);color:var(--a)}
.claim-badge.obs{border-color:rgba(52,211,153,.5);color:var(--e)}
h1{font-size:42px;line-height:1.08;margin:0;font-weight:800;letter-spacing:-.01em}
body.vertical h1{font-size:36px}
h1 span{display:inline-block;margin-right:.24em}
.vis{position:relative;height:600px;display:flex;align-items:center;justify-content:center;gap:24px}
.phone{width:250px;border-radius:30px;border:6px solid #1d2c37;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);background:#071018}
.phone img,.desk img{display:block;width:100%}
.desk{width:636px;border-radius:14px;border:1px solid var(--l);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);background:#071018;position:relative}
.desk .bar{height:26px;background:#0f1d27;display:flex;gap:6px;align-items:center;padding:0 10px}.desk .bar i{width:10px;height:10px;border-radius:50%;background:#2a3d4a}
.crop{overflow:hidden;position:relative}.crop img{position:absolute;left:0;top:0;width:100%}
.kpis{display:flex;flex-direction:column;gap:14px;width:100%}
.kpi{background:rgba(11,20,28,.88);border:1px solid var(--l);border-radius:18px;padding:16px 22px}.kpi b{display:block;font-size:52px;line-height:1;color:var(--e);font-weight:800}.kpi span{color:var(--m);font-size:17px}
.kpi.warn b{color:var(--a)}
.over{position:absolute;right:0;bottom:10px;display:flex;flex-direction:column;gap:10px;width:300px}.over .kpi b{font-size:38px}.over .kpi span{font-size:14px}
.hub{position:relative;width:640px;height:600px}
.node{position:absolute;transform:translate(-50%,-50%);padding:10px 14px;border-radius:14px;background:#0b141c;border:1px solid var(--l);font-size:16px;white-space:nowrap}
.core{background:var(--c);color:#140804;font-weight:800;font-size:24px;padding:18px 26px;border:none}
svg{position:absolute;inset:0}
.stack{display:grid;grid-template-columns:1fr;gap:14px;width:100%}
.card{background:rgba(11,20,28,.9);border:1px solid var(--l);border-radius:16px;padding:16px 20px}.card b{font-size:22px}.card p{margin:6px 0 0;color:var(--m);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.chip{padding:10px 14px;border-radius:999px;border:1px solid var(--l);background:#0b141c;font-size:17px}
.url{font:700 30px ui-monospace,monospace;color:var(--i);margin-top:26px}
body.vertical .url{font-size:22px}
.copyright{font:500 13px Inter,system-ui;color:var(--m);margin-top:14px;letter-spacing:.03em}
.missing li{color:var(--m);font-size:17px;margin:6px 0}.missing{padding-left:22px;margin:4px 0}
canvas.c2d{width:640px;height:600px}
iframe.pg{width:640px;height:600px;border:0;border-radius:14px;background:#05090c;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.scene.full{padding:56px 64px}.scene.full>*{position:relative;z-index:2}.scene.full .slot{position:absolute;inset:0;z-index:0}.scene.full .slot canvas{width:1280px;height:720px;display:block}
.scene.full .shade{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(5,9,12,.94) 0,rgba(5,9,12,.82) 30%,rgba(5,9,12,0) 50%)}
.hud{position:absolute!important;right:28px;bottom:44px;width:300px;background:rgba(11,20,28,.86);border:1px solid var(--l);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--m)}
.hud .h-t{font:700 12px ui-monospace,monospace;color:var(--c);letter-spacing:.06em;margin-bottom:6px}.hud code{color:var(--i)}.hud .h-s{color:var(--t);font-weight:600;margin-bottom:8px}
.hud .h-big{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}.hud .h-big b{display:block;font-size:26px;color:var(--t);line-height:1.1}.hud .h-big span{font-size:11px}.hud .strike{text-decoration:line-through;text-decoration-color:#ff7756;color:#ff9a86!important}
.hud table{width:100%;border-collapse:collapse}.hud td{padding:2px 4px;border-top:1px solid #16242e;color:var(--t)}.hud td.s{color:#ff9a86;text-decoration:line-through}.hud td i{color:var(--m);font-style:normal;font-size:11px}
.hud.small{width:232px;font-size:12px;padding:10px 12px}.hud .h-l{display:flex;align-items:center;gap:8px;margin:3px 0;color:var(--t)}.hud .h-l i{width:12px;height:12px;border-radius:3px;display:inline-block}
#sub{display:none}
body.burnsub #sub{display:flex;position:absolute;left:32px;right:32px;bottom:52px;justify-content:center;z-index:30;pointer-events:none}
body.burnsub #sub span{background:rgba(5,9,12,.92);border:1px solid rgba(255,119,86,.55);color:#fff;font:600 20px/1.36 Inter,system-ui;padding:12px 18px;border-radius:12px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.75)}
#brand{position:absolute;left:64px;bottom:22px;font:700 14px system-ui;letter-spacing:.22em;color:var(--m)}#brand b{color:var(--c)}
body.vertical #brand{left:40px;bottom:18px;font-size:12px}
#prog{position:absolute;left:0;bottom:0;height:4px;background:var(--c)}
</style>
</head>
<body>
<canvas id="bg" width="1280" height="720"></canvas>
<div id="stage"></div>
<div id="sub"><span id="sub-txt"></span></div>
<div id="brand"><b>SENDA</b> · civic-relay-investor.vercel.app/senda</div><div id="prog"></div>
<script>
const Q = new URLSearchParams(location.search);
const LANG = Q.get('lang') || 'es';
const SCRIPT_NAME = Q.get('script') || 'script', PFX = SCRIPT_NAME === 'script' ? '' : `${SCRIPT_NAME}-`;
const VERTICAL = Q.get('vertical') === '1';
const BURNSUB = Q.get('burnsub') || '';
const T0 = Q.has('t0') ? +Q.get('t0') : -1e9;
const T1 = Q.has('t1') ? +Q.get('t1') : 1e9;
if (VERTICAL) {
  document.body.classList.add('vertical');
  const bg = document.getElementById('bg'); bg.width = 720; bg.height = 1280;
}
if (BURNSUB) document.body.classList.add('burnsub');

const T = (o) => (typeof o === 'string' ? o : o?.[LANG] ?? o?.en ?? o?.es ?? '');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const CROPS = { top: [235, 965], middle: [985, 2060], lower: [2090, 2860] };
const BEARERS = { es: ['Teléfonos cercanos', 'Sonido', 'Satélite directo al móvil', 'LoRa', 'Iridium', 'Radioaficionados · QO-100', 'Drones', 'SMS', 'Relé por Internet', 'Galileo SAR'], en: ['Nearby phones', 'Sound', 'Direct-to-phone satellite', 'LoRa', 'Iridium', 'Amateur radio · QO-100', 'Drones', 'SMS', 'Internet relay', 'Galileo SAR'] };
const L = {
  es: { stack: [['Relé autoalojable (Docker)', 'Lo opera el organismo. Ciego al contenido. Persistente.'], ['SENDA Android', 'Baliza Bluetooth, escucha de balizas y barrido wifi. Nunca sin tu toque.'], ['Accesorio ESP32', 'Barrido de routers y balizas desde mástil o dron.'], ['Mismos formatos en JS · Java · C++', 'Vectores de prueba compartidos: nada se rompe entre piezas.']],
    missing: ['Pilotos de campo con teléfonos físicos y equipos de rescate', 'Auditoría de seguridad independiente', 'Certificación para compra pública (ENS, accesibilidad EN 301 549)'], core: 'pruebas del núcleo', pci: 'vectores compartidos PCI (Ed25519)', e2e: 'comprobaciones extremo a extremo sin red', who: ['Ciudadanía', 'Coordinadores', 'Cuerpos de seguridad', 'Servicios de emergencia', 'Administraciones', 'Inversores'] },
  en: { stack: [['Self-hosted relay (Docker)', 'Run by the agency. Content-blind. Persistent.'], ['SENDA Android', 'Bluetooth beacon, beacon listening and Wi-Fi sweeps. Never without your tap.'], ['ESP32 accessory', 'Router and beacon sweeps from a mast or drone.'], ['Same formats in JS · Java · C++', 'Shared test vectors: nothing breaks between parts.']],
    missing: ['Field pilots with physical phones and rescue teams', 'Independent security audit', 'Public-procurement certification (security, EN 301 549 accessibility)'], core: 'core tests', pci: 'shared PCI test vectors (Ed25519)', e2e: 'offline end-to-end checks', who: ['Citizens', 'Coordinators', 'Police', 'Emergency services', 'Public administrations', 'Investors'] },
};
let SCRIPT, TL, scenesEl = [];
const NUM = {
  core: +(Q.get('core') || 266),
  e2e:  +(Q.get('e2e')  || 49),
  pci:  +(Q.get('pci')  || 13),
};

const CLAIM_INFO = {
  OBSERVED:   { en: 'OBSERVED · VERIFIED EVIDENCE', es: 'OBSERVADO · EVIDENCIA VERIFICADA', cls: 'obs' },
  CALCULATED: { en: 'COMPUTED FROM THE APP CORE',   es: 'CALCULADO POR EL NÚCLEO REAL',     cls: '' },
  SIMULATED:  { en: 'SIMULATION · COMPUTED FROM THE APP CORE', es: 'SIMULACIÓN · CALCULADA POR EL NÚCLEO', cls: 'sim' },
  INFERRED:   { en: 'INFERRED · WITH CONFIDENCE MARGIN', es: 'INFERIDO · CON MARGEN DE CONFIANZA', cls: 'sim' },
};

const VIZ_NOTE = {
  cadena:     { en: 'SIMULATION · SYNTHETIC TRAFFIC', es: 'SIMULACIÓN · TRÁFICO SINTÉTICO' },
  sos:        { en: 'SIMULATION · SYNTHETIC TRAFFIC', es: 'SIMULACIÓN · TRÁFICO SINTÉTICO' },
  pk:         { en: 'INVENTED ROAD · DEMO',           es: 'CARRETERA INVENTADA · DEMO' },
  escena:     { en: 'SIMULATION · PAS PROTOCOL',      es: 'SIMULACIÓN · PROTOCOLO PAS' },
  kamikaze:   { en: 'SIMULATION · SYNTHETIC TRAFFIC', es: 'SIMULACIÓN · TRÁFICO SINTÉTICO' },
  retencion:  { en: 'SIMULATION · SYNTHETIC TRAFFIC', es: 'SIMULACIÓN · TRÁFICO SINTÉTICO' },
  niebla:     { en: 'SYNTHETIC IMAGE · METHOD TEST',  es: 'IMAGEN SINTÉTICA · PRUEBA DEL MÉTODO' },
  msi:        { en: 'SIMULATION · MSI GANTRY',        es: 'SIMULACIÓN · PÓRTICO MSI' },
  detectores: { en: 'SIMULATION · DGT COUNTING LOOPS', es: 'SIMULACIÓN · ESPIRAS DGT' },
};

function badgeHTML(sc) {
  const ck = sc.claim || (sc.visual?.kind === 'page' || sc.visual?.kind === 'drone3d' ? 'SIMULATED' : 'CALCULATED');
  const ci = CLAIM_INFO[ck] || CLAIM_INFO.CALCULATED;
  let out = `<span class="claim-badge ${ci.cls}">${LANG === 'en' ? ci.en : ci.es}</span>`;
  if (sc.visual?.kind === 'page' && sc.visual.src) {
    const m = /[?&]viz=([^&]+)/.exec(sc.visual.src);
    const vn = m && VIZ_NOTE[m[1]];
    if (vn) out += `<span class="claim-badge sim">${LANG === 'en' ? vn.en : vn.es}</span>`;
  }
  return `<div class="badges">${out}</div>`;
}

function sceneInSlice(idx) {
  const s = TL?.scenes?.[idx];
  if (!s) return true;
  return !(s.end < T0 - 1.0 || s.start > T1 + 1.0);
}

function visualHTML(sc, idx) {
  if (!sceneInSlice(idx)) return '';
  const v = sc.visual, img = (f) => `assets/${f}`;
  const kp = (list, cls = '') => list.map((k, i) => `<div class="kpi ${cls} k${i}"><b>${T(k.v)}</b><span>${T(k.l)}</span></div>`).join('');
  if (v.kind === 'kpis') return `<div class="kpis">${kp(v.kpis)}</div>`;
  if (v.kind === 'hub') { const B = BEARERS[LANG] ?? BEARERS.en; return `<div class="hub"><svg width="640" height="600" id="hub-svg-${idx}"></svg>${B.map((b, i) => { const a = (i / B.length) * Math.PI * 2 - Math.PI / 2; return `<div class="node b${i}" style="left:${320 + 250 * Math.cos(a)}px;top:${300 + 225 * Math.sin(a)}px">${b}</div>`; }).join('')}<div class="node core" style="left:320px;top:300px">SENDA</div></div>`; }
  if (v.kind === 'shots') {
    const frames = v.images.map((f, i) => {
      if (typeof f === 'object') {
        const sc2 = 636 / 1280, [y0, y1] = f.crop;
        return `<div class="desk f${i}"><div class="bar"><i></i><i></i><i></i></div><div class="crop" style="height:${Math.round((y1 - y0) * sc2)}px"><img src="${img(f.f)}" style="top:${-Math.round(y0 * sc2)}px"></div></div>`;
      }
      if (/e2e-(06|08|12)/.test(f)) {
        const [y0, y1] = v.crop ? CROPS[v.crop] : [0, /06/.test(f) ? 1000 : 900]; const sc2 = 636 / 1280;
        return `<div class="desk f${i}"><div class="bar"><i></i><i></i><i></i></div><div class="crop" style="height:${Math.round((y1 - y0) * sc2)}px"><img src="${img(f)}" style="top:${-Math.round(y0 * sc2)}px"></div></div>`;
      }
      const tall = /e2e-11/.test(f);
      return `<div class="phone f${i}"><div class="crop" style="height:${tall ? 520 : 540}px"><img src="${img(f)}"></div></div>`;
    }).join('');
    return frames + (v.kpis ? `<div class="over">${kp(v.kpis)}</div>` : '');
  }
  if (v.kind === 'stack') return `<div class="stack">${(L[LANG] ?? L.en).stack.map(([t, p], i) => `<div class="card s${i}"><b>${t}</b><p>${p}</p></div>`).join('')}</div>`;
  if (v.kind === 'verify') {
    const l = L[LANG] ?? L.en;
    return `<div class="kpis"><div class="kpi k0"><b>${NUM.core}/${NUM.core} · ${NUM.pci}/${NUM.pci}</b><span>${l.core} · ${l.pci}</span></div><div class="kpi k1"><b>${NUM.e2e}/${NUM.e2e}</b><span>${l.e2e}</span></div><div class="kpi warn k2"><ul class="missing">${l.missing.map((m) => `<li>${m}</li>`).join('')}</ul></div></div>`;
  }
  if (v.kind === 'page') {
    const src = v.src.includes('lang=') ? v.src : v.src + (v.src.includes('?') ? '&' : '?') + 'lang=' + LANG;
    return `<iframe class="pg" src="${src}" width="640" height="600" title="${T(sc.title)}"></iframe>`;
  }
  if (v.kind === 'call' || v.kind === 'howsim') return '<canvas class="c2d" width="640" height="600"></canvas>';
  if (v.kind === 'cta') {
    const l = L[LANG] ?? L.en;
    return `<div><div class="chips">${l.who.map((w, i) => `<span class="chip w${i}">${w}</span>`).join('')}</div><div class="url">civic-relay-investor.vercel.app/senda</div><div class="copyright">© 2026 Abraham Haddioui · SENDA · MIT License · 112 first</div></div>`;
  }
  return '';
}

function build() {
  const stage = document.getElementById('stage');
  const head = (sc, i) => `<div><div class="eyebrow">SENDA · ${String(i + 1).padStart(2, '0')} / ${String(SCRIPT.scenes.length).padStart(2, '0')}</div>${badgeHTML(sc)}<h1>${T(sc.title).split(' ').map((w) => `<span>${w}</span>`).join('')}</h1></div>`;
  stage.innerHTML = SCRIPT.scenes.map((sc, i) => SIMS.full(sc.visual.kind)
    ? `<section class="scene full" id="sc-${i}"><div class="slot"></div><div class="shade"></div>${head(sc, i)}<div></div><div class="hud"></div></section>`
    : `<section class="scene" id="sc-${i}">${head(sc, i)}<div class="vis">${visualHTML(sc, i)}</div></section>`).join('');
  scenesEl = SCRIPT.scenes.map((_, i) => document.getElementById('sc-' + i));
}

function drawBg(t) {
  const c = document.getElementById('bg');
  const W = VERTICAL ? 720 : 1280, H = VERTICAL ? 1280 : 720;
  const g = c.getContext('2d');
  g.fillStyle = '#05090c'; g.fillRect(0, 0, W, H);
  const grd = g.createRadialGradient(W * 0.76, H * 0.5, 40, W * 0.76, H * 0.5, 700);
  grd.addColorStop(0, 'rgba(255,119,86,.10)'); grd.addColorStop(1, 'rgba(5,9,12,0)');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(145,215,232,.22)';
  for (let i = 0; i < 90; i++) {
    const x = (i * 137.5 + t * (6 + (i % 5))) % (W + 20) - 10;
    const y = (i * 71.3 + Math.sin(t * 0.3 + i) * 8) % H;
    g.fillRect(x, y, 2, 2);
  }
}

window.seek = (t) => {
  drawBg(t);
  document.getElementById('prog').style.width = (100 * t / TL.duration) + '%';
  let activeSub = '';
  TL.scenes.forEach((s, i) => {
    const el = scenesEl[i]; const lt = t - s.start, d = s.end - s.start;
    const vis = lt >= -0.01 && lt < d;
    if (!vis) {
      if (el.style.display !== 'none') el.style.display = 'none';
      return;
    }
    if (el.style.display !== 'grid') el.style.display = 'grid';
    const fade = Math.min(ease(lt / 0.6), ease((d - lt) / 0.5));
    el.style.opacity = fade;
    if (BURNSUB && s.lines) {
      const subArr = SCRIPT.scenes[i][BURNSUB] || SCRIPT.scenes[i].en || [];
      for (let j = 0; j < s.lines.length; j++) {
        const ln = s.lines[j];
        if (t >= ln.start - 0.05 && t <= ln.end + 0.35) { activeSub = subArr[j] || ln.text || ''; break; }
      }
    }
    el.querySelectorAll('h1 span').forEach((w, j) => { const p = ease((lt - 0.15 - j * 0.07) / 0.5); w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 18}px)`; });
    const cue = (n) => s.cues[n] ?? s.cues[s.cues.length - 1] ?? 0;
    const appear = (sel, at, dy = 26) => el.querySelectorAll(sel).forEach((x) => { const p = ease((lt - at) / 0.7); x.style.opacity = p; x.style.transform = `translateY(${(1 - p) * dy}px) scale(${0.97 + 0.03 * p})`; });
    for (let k = 0; k < 6; k++) {
      const kind = SCRIPT.scenes[i].visual.kind;
      const kAt = (kind === 'kpis' || kind === 'verify')
        ? (0.35 + k * 0.55)
        : (cue(Math.min(k + (kind === 'shots' ? 1 : 0), s.cues.length - 1)) + 0.3 + k * 0.6);
      appear(`.k${k}`, kAt);
      appear(`.s${k}`, 0.35 + k * 0.7);
      appear(`.w${k}`, 0.25 + k * 0.22);
      appear(`.f${k}`, 0.3 + k * 0.5, 40);
    }
    el.querySelectorAll('.f0 img,.f1 img').forEach((im) => { const z = 1 + 0.04 * clamp(lt / d); im.style.transformOrigin = '50% 0'; im.style.transform = `scale(${z})`; });
    const slt = Math.max(0, lt);
    SIMS.draw(SCRIPT.scenes[i].visual.kind, el, slt, d, cue);
    const pg = el.querySelector('iframe.pg'); if (pg) pg.contentWindow?.SENDA_VIZ?.seek(Math.max(0, slt - 0.3));
    const url = el.querySelector('.url'); if (url) { const p = ease((slt - Math.min(1.5, cue(1))) / 0.7); url.style.opacity = p; }
    const hub = el.querySelector('.hub');
    if (hub) {
      const nodes = [...hub.querySelectorAll('.node:not(.core)')]; const svg = hub.querySelector('svg');
      let lines = '';
      nodes.forEach((n, j) => { const at = cue(1) + j * 0.55; const p = ease((slt - at) / 0.5); n.style.opacity = 0.15 + 0.85 * p; const x = parseFloat(n.style.left), y = parseFloat(n.style.top);
        if (p > 0) { const ph = ((slt * 0.8 + j * 0.13) % 1); lines += `<line x1="320" y1="300" x2="${x}" y2="${y}" stroke="rgba(145,215,232,${0.35 * p})" stroke-width="2"/><circle cx="${x + (320 - x) * ph}" cy="${y + (300 - y) * ph}" r="5" fill="#ff7756" opacity="${p}"/>`; } });
      svg.innerHTML = lines;
    }
  });
  if (BURNSUB) {
    const subEl = document.getElementById('sub-txt');
    subEl.textContent = activeSub;
    subEl.style.display = activeSub ? 'inline-block' : 'none';
  }
};

(async () => {
  SCRIPT = await (await fetch(`${SCRIPT_NAME}.json`)).json();
  let tlData = null;
  try {
    const r = await fetch(`build/timings-${SCRIPT_NAME}-${LANG}.json`);
    if (r.ok) {
      const j = await r.json();
      tlData = {
        duration: j.totalDuration,
        scenes: j.scenes.map((s) => ({
          id: s.id,
          start: s.start,
          end: s.end,
          lines: s.lines || [],
          cues: (s.lines || []).map((l) => +(l.start - s.start).toFixed(3)),
        })),
      };
    }
  } catch {}
  if (!tlData) {
    await new Promise((res) => { const s = document.createElement('script'); s.src = `out/timeline-${PFX}${LANG}.js`; s.onload = res; document.head.appendChild(s); });
    tlData = window.TIMELINE;
  }
  TL = tlData; window.TIMELINE = TL; window.DURATION = TL.duration;
  document.documentElement.lang = LANG;
  window.__NEED_DRONE = SCRIPT.scenes.some((sc, i) => sceneInSlice(i) && sc.visual?.kind === 'drone3d');
  window.__NEED_ARCH = SCRIPT.scenes.some((sc, i) => sceneInSlice(i) && sc.visual?.kind === 'arch3d');
  build();
  await SIMS.init();
  SCRIPT.scenes.forEach((sc, i) => {
    if (!sceneInSlice(i)) return;
    const c = SIMS.canvasFor(sc.visual.kind);
    if (c) scenesEl[i].querySelector('.slot').appendChild(c);
  });
  await Promise.all([...document.querySelectorAll('iframe.pg')].map((f) => new Promise((ok) => { const chk = () => (f.contentWindow?.SENDA_VIZ_READY ? ok() : setTimeout(chk, 50)); chk(); })));
  await Promise.all([...document.images].map((im) => (im.complete ? 1 : new Promise((r) => { im.onload = im.onerror = r; }))));
  window.seek(+(Q.get('t') || (Q.has('t0') ? +Q.get('t0') : 0)));
  window.READY = true;
})();
</script>
</body>
</html>
