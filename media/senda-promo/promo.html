<!doctype html>
<html><head><meta charset="utf-8"><title>SENDA · promo</title>
<style>
:root{--bg:#05090c;--t:#f2f4f4;--m:#9fb2bc;--c:#ff7756;--i:#91d7e8;--e:#34d399;--a:#fbbf24}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#stage{position:relative;width:100vw;height:100vh;background:radial-gradient(ellipse at 70% 0%,rgba(145,215,232,.08),transparent 60%),var(--bg)}
.layer{position:absolute;inset:0;opacity:0}
.head{position:absolute;z-index:5}.kicker{color:var(--c);font-weight:800;letter-spacing:.14em;text-transform:uppercase}.title{font-weight:900;letter-spacing:-.025em;line-height:1.02;margin-top:6px}
.box{position:absolute;border-radius:16px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(145,215,232,.35);border:1px solid #203240}
.caption{position:absolute;z-index:6;text-align:center;font-weight:700;line-height:1.3;text-shadow:0 2px 12px #000}
.caption span{background:rgba(5,9,12,.78);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:4px 12px;border-radius:8px}
.brand{position:absolute;z-index:6;font-weight:900;letter-spacing:.1em}.brand small{display:block;font-size:.55em;color:var(--m);letter-spacing:.14em;font-weight:600}
.disc{position:absolute;z-index:6;color:var(--m)}
.bar{position:absolute;left:0;top:0;height:4px;background:linear-gradient(90deg,var(--c),var(--i));z-index:7}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 7%}
.card .kicker{font-size:22px}.card .title{font-size:var(--card-size);max-width:16ch}
.ring{position:absolute;border-radius:50%;border:2px solid var(--i);opacity:.4}
.imgs{position:absolute;overflow:hidden;border-radius:16px;border:1px solid #203240}.imgs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0}
.tag{position:absolute;z-index:3;left:14px;top:14px;background:var(--e);color:#03140d;font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px}
/* 16:9 */
.f16 .head{left:48px;top:30px}.f16 .kicker{font-size:15px}.f16 .title{font-size:40px}
.f16 .box,.f16 .imgs{left:48px;top:128px;width:1184px;height:470px}
.f16 .caption{left:80px;right:80px;bottom:34px;font-size:27px}.f16 .brand{right:40px;top:30px;font-size:22px;text-align:right}.f16 .disc{left:48px;bottom:8px;font-size:12px}
/* 9:16 */
.f9 .head{left:28px;right:28px;top:64px}.f9 .kicker{font-size:15px}.f9 .title{font-size:40px}
.f9 .box,.f9 .imgs{left:20px;top:250px;width:500px;height:500px}
.f9 .caption{left:22px;right:22px;top:772px;font-size:25px}.f9 .brand{left:28px;bottom:26px;font-size:20px}.f9 .disc{right:20px;bottom:30px;font-size:11px;max-width:230px;text-align:right}
</style></head>
<body><div id="stage"><div class="bar" id="bar"></div><div class="head" id="head"><div class="kicker" id="kicker"></div><div class="title" id="title"></div></div>
<div class="caption" id="cap"></div><div class="brand">SENDA<small>offline first, for sure</small></div><div class="disc" id="disc"></div></div>
<script type="module">
const q = new URLSearchParams(location.search), VIDEO = q.get('video') || 'investor', LANG = q.get('lang') || 'es';
const cfg = await (await fetch('/promo/scripts.json')).json(), V = cfg.videos[VIDEO], F9 = V.format === '9x16';
await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = `/promo/out/timeline-${VIDEO}-${LANG}.js`; s.onload = ok; s.onerror = ko; document.head.append(s); });
const TL = window.TIMELINE, stage = document.getElementById('stage'), DPR = F9 ? 2 : 1.5;
stage.className = F9 ? 'f9' : 'f16'; document.getElementById('disc').textContent = cfg.disclaimer[LANG];
const { createDemo } = await import('/senda/home/demos.mjs');
const BOX = F9 ? { w: 500, h: 500 } : { w: 1184, h: 470 }, FULL = F9 ? { w: 540, h: 960 } : { w: 1280, h: 720 };
const scenes = [];
for (const [i, sc] of V.scenes.entries()) {
  const tl = TL.scenes[i], layer = document.createElement('div'); layer.className = 'layer'; stage.append(layer);
  const S = { sc, tl, layer, demo: null, applied: null };
  if (sc.view === 'hero') { const h = document.createElement('div'); h.style.cssText = 'position:absolute;inset:0;opacity:.8'; layer.append(h); S.demo = createDemo('hero', h, { lang: LANG, fixed: { ...FULL, dpr: DPR } }); }
  else if (sc.view === 'card') { layer.classList.add('card'); layer.style.setProperty('--card-size', F9 ? '50px' : '68px'); layer.innerHTML = `<div class="ring" id="r${i}"></div><div class="kicker">${sc.kicker[LANG]}</div><div class="title">${sc.title[LANG]}</div>`; }
  else if (sc.view === 'images') { const w = document.createElement('div'); w.className = 'imgs'; w.innerHTML = `<span class="tag">${LANG === 'es' ? 'App real · Chromium sin red' : 'Real app · offline Chromium'}</span>` + sc.images.map((f) => `<img src="/evidence/senda/${f}" alt="">`).join(''); layer.append(w); }
  else { const b = document.createElement('div'); b.className = 'box'; layer.append(b); S.demo = createDemo(sc.view, b, { lang: LANG, fixed: { ...BOX, dpr: DPR } }); }
  scenes.push(S);
}
await Promise.all(scenes.map((S) => S.demo?.ready ? new Promise((ok) => { const w = () => (S.demo.ready() ? ok() : setTimeout(w, 50)); w(); }) : null));
await Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((ok) => { im.onload = im.onerror = ok; })));
await new Promise((ok) => setTimeout(ok, 600)); // costas del globo
window.DURATION = TL.duration;
window.seek = async (t) => {
  const i = Math.max(0, TL.scenes.findIndex((s) => t >= s.start && t < s.end)), S = scenes[i === -1 ? scenes.length - 1 : i], lt = t - S.tl.start, sc = S.sc;
  scenes.forEach((x) => { x.layer.style.opacity = x === S ? String(Math.min(1, lt / 0.35)) : '0'; });
  const head = document.getElementById('head'); head.style.opacity = sc.view === 'card' ? '0' : String(Math.min(1, lt / 0.5));
  document.getElementById('kicker').textContent = sc.kicker[LANG]; document.getElementById('title').textContent = sc.title[LANG];
  if (S.demo) {
    let key = -1, state = { ...(sc.state || {}) }, at = 0;
    (sc.steps || []).forEach((st, k) => { const c = S.tl.cues[st.cue]; if (c != null && lt >= c) { Object.assign(state, st.set); key = k; at = c; } });
    if (S.applied !== key) { // ancla el reloj de la demo al instante de la frase: determinista aunque se renderice por tramos
      S.demo.render(at); if (sc.state || key >= 0) await S.demo.set(key >= 0 ? state : { ...(sc.state || {}) }); S.applied = key;
      if (sc.view === 'crypto') await new Promise((ok) => { const w = () => (S.demo.ready() ? ok() : setTimeout(w, 20)); w(); });
    }
    S.demo.render(lt);
  }
  if (sc.view === 'images') { const ims = S.layer.querySelectorAll('img'), per = (S.tl.end - S.tl.start) / ims.length; ims.forEach((im, k) => { const u = (lt - k * per) / per; im.style.opacity = String(u < -0.1 || u > 1.1 ? 0 : Math.min(1, (u + 0.1) / 0.2, (1.1 - u) / 0.2)); im.style.transform = `scale(${1.04 + 0.08 * Math.max(0, u)}) translateY(${-3 * Math.max(0, u)}%)`; }); }
  if (sc.view === 'card') { const r = S.layer.querySelector('.ring'), d = 160 + (lt % 2.4) * 260; r.style.cssText = `width:${d}px;height:${d}px;left:calc(50% - ${d / 2}px);top:calc(50% - ${d / 2}px);opacity:${Math.max(0, 0.45 - (lt % 2.4) / 5.5)}`; }
  const sub = TL.subs.find(([a, b]) => t >= a - 0.05 && t < b + 0.3), cap = document.getElementById('cap');
  cap.innerHTML = sub ? `<span>${sub[2]}</span>` : ''; cap.style.opacity = sub ? String(Math.min(1, (t - sub[0] + 0.05) / 0.2)) : '0';
  document.getElementById('bar').style.width = `${(100 * t) / TL.duration}%`;
};
await window.seek(0); window.READY = true;
</script></body></html>
