  { id: 'dana', kind: 'flood', lat: 39.42, lon: -0.42, date: '29-10-2024', name: { es: 'DANA de Valencia', en: 'Valencia DANA floods' },

/* ------------------------------------------------------------------ geometría */
const ecefUnit = (lat, lon) => [Math.cos(lat * D) * Math.cos(lon * D), Math.cos(lat * D) * Math.sin(lon * D), Math.sin(lat * D)];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const dispR = (altKm) => 1 + 0.15 * Math.log1p(altKm / 780) / Math.LN2; // altitud en escala logarítmica (no a escala)
function satEcef(el, tMs) { const e = propagateKeplerJ2(el, tMs), g = gmst(tMs); return [Math.cos(g) * e.x + Math.sin(g) * e.y, -Math.sin(g) * e.x + Math.cos(g) * e.y, e.z]; }
function look(obs, sat) { const o = ecefUnit(obs.lat, obs.lon).map((v) => v * RE), d = [sat[0] - o[0], sat[1] - o[1], sat[2] - o[2]], r = Math.hypot(...d); return { el: Math.asin(dot(d, ecefUnit(obs.lat, obs.lon)) / r) / D, range: r }; }
const geoEcef = (lon) => ecefUnit(0, lon).map((v) => v * (RE + 35786));

/* ------------------------------------------------------------------ estado */
const cv = $('#g'), g = cv.getContext('2d');
const st = { lon0: -4, lat0: 36, zoom: 1, speed: 60, playing: true, sel: CASES[6], net: 'iridium', show: { iridium: true, galileo: true, qo100: true }, simT: 0, last: performance.now(), drag: null, pinch: null };
let LAND = null; fetch('/geo/land-110m.json').then((r) => r.json()).then((j) => { LAND = j.rings; }).catch(() => {});
const STARS = Array.from({ length: 260 }, (_, i) => ({ x: ((i * 7919) % 1000) / 1000, y: ((i * 104729) % 997) / 997, s: (i % 7) / 7 }));

function resize() { const r = Math.min(2, devicePixelRatio || 1), w = cv.clientWidth, h = Math.round(w * 0.82); cv.width = w * r; cv.height = h * r; g.setTransform(r, 0, 0, r, 0, 0); st.W = w; st.H = h; }
addEventListener('resize', resize); resize();

/* ------------------------------------------------------------------ controles */
const ctrl = $('#ctrl');
const btn = (label, fn, cls = '') => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.className = cls; b.onclick = fn; return b; };
const playB = btn(T(TX.play), () => { st.playing = !st.playing; playB.textContent = st.playing ? T(TX.play) : T(TX.resume); });
const sp = document.createElement('label'); sp.className = 'chip'; sp.innerHTML = `${T(TX.speed)} <input type="range" min="1" max="600" value="60" aria-label="${T(TX.speed)}"> <output>×60</output>`;
sp.querySelector('input').oninput = (e) => { st.speed = +e.target.value; sp.querySelector('output').textContent = '×' + st.speed; };
ctrl.append(playB, sp, btn(T(TX.spain), () => { st.lon0 = -4; st.lat0 = 36; st.zoom = 1; }), btn(T(TX.far), () => { st.zoom = 0.42; }));
for (const [k, n] of Object.entries(NETS)) { const l = document.createElement('label'); l.className = 'chip'; l.innerHTML = `<input type="checkbox" checked> <i style="background:${n.color}"></i>${T(n.name)}`; l.querySelector('input').onchange = (e) => { st.show[k] = e.target.checked; }; ctrl.append(l); }
$('#cases').innerHTML = CASES.map((c) => `<button type="button" data-id="${c.id}"><span style="color:${KIND[c.kind].c}">●</span> ${T(c.name)}<small>${T(KIND[c.kind])} · ${T(c.date)}</small></button>`).join('');
$('#cases').onclick = (e) => { const b = e.target.closest('button'); if (b) select(CASES.find((c) => c.id === b.dataset.id)); };
$('#nets').innerHTML = Object.entries(NETS).map(([k, n]) => `<button type="button" data-net="${k}">${T(n.name)}</button>`).join('');
$('#nets').onclick = (e) => { const b = e.target.closest('button'); if (b) { st.net = b.dataset.net; panel(); } };

/* textos fijos */
$('#t-lead').textContent = T(TX.lead); $('#t-cases').textContent = T(TX.cases); $('#t-what').textContent = T(TX.what); $('#t-mods').textContent = T(TX.mods); $('#t-how').textContent = T(TX.how); $('#t-lim').textContent = T(TX.lim);
$('#legend').innerHTML = Object.values(NETS).map((n) => `<div><i style="background:${n.color}"></i><span><b>${T(n.name)}.</b> ${T(n.what)}</span></div>`).join('') +
  Object.values(KIND).map((k) => `<div><i style="background:${k.c};border-radius:2px"></i><span><b>${T(k)}</b>: ${LANG === 'es' ? 'caso real sobre el mapa; el anillo pulsante es el caso elegido' : 'real case on the map; the pulsing ring is the selected case'}.</span></div>`).join('') +
  `<div><i style="background:#fff"></i><span>${LANG === 'es' ? '<b>Línea sólida</b>: enlace de subida del lugar al satélite elegido (sobre el horizonte). <b>Línea discontinua</b>: ruta lógica por la red del operador hasta el relé SENDA. <b>Estela</b>: últimos minutos de órbita. <b>Lado oscuro</b>: noche en ese momento.' : '<b>Solid line</b>: uplink from the site to the chosen satellite (above the horizon). <b>Dashed line</b>: logical route through the operator’s network to the SENDA relay. <b>Trail</b>: last minutes of orbit. <b>Dark side</b>: night at that moment.'}</span></div>`;
$('#mods').innerHTML = Object.values(MOD).map((m) => `<tr><td><a href="${m.href}">${m[LANG]}</a></td><td>${T(m.d)}</td></tr>`).join('');
$('#how').innerHTML = LANG === 'es'
  ? '<p>Cada satélite se propaga con elementos orbitales y el modelo Kepler + J2 del núcleo (<code>orbital.mjs</code>), se rota con el tiempo sidéreo de Greenwich y se compara con la posición del caso: si su <b>elevación</b> supera el mínimo de su red, está a la vista.</p><p>La <b>distancia</b> es la línea recta del lugar al satélite y la <b>latencia de propagación</b> es esa distancia entre la velocidad de la luz (solo la ida; la red del operador añade su propio retardo).</p><p>Para el caso elegido, el <b>plan multiportador</b> (<code>bearers.mjs</code>) reparte un SOS de 600 B entre los canales que siguen vivos y calcula la probabilidad exacta de que llegue.</p>'
  : '<p>Each satellite is propagated with orbital elements and the core’s Kepler + J2 model (<code>orbital.mjs</code>), rotated with Greenwich sidereal time and compared with the case’s position: if its <b>elevation</b> exceeds its network’s minimum, it is in view.</p><p><b>Distance</b> is the straight line from the site to the satellite and <b>propagation latency</b> is that distance divided by the speed of light (one way; the operator’s network adds its own delay).</p><p>For the selected case, the <b>multi-bearer plan</b> (<code>bearers.mjs</code>) spreads a 600 B SOS across the channels still alive and computes the exact probability that it arrives.</p>';
$('#lim').innerHTML = LANG === 'es'
  ? '<p>Las posiciones son <b>ilustrativas</b>: se usan la geometría pública de cada constelación (número de satélites, planos, inclinación y altitud), no las efemérides del día. Con red, el núcleo ya admite TLE reales (<code>parseTle</code>).</p><p>Las altitudes se dibujan en <b>escala logarítmica</b> para que quepan en pantalla.</p><p>Los casos enlazan a su fuente; las causas de Adamuz y Gelida siguen bajo investigación oficial. El incendio de El Tiemblo es un escenario de demostración.</p><p>SENDA es un canal secundario: no sustituye al 112 ni a ES-Alert.</p>'
  : '<p>Positions are <b>illustrative</b>: they use each constellation’s public geometry (number of satellites, planes, inclination and altitude), not today’s ephemerides. When online, the core already accepts real TLEs (<code>parseTle</code>).</p><p>Altitudes are drawn on a <b>logarithmic scale</b> so they fit on screen.</p><p>Cases link to their source; the causes of Adamuz and Gelida remain under official investigation. The El Tiemblo wildfire is a demonstration scenario.</p><p>SENDA is a secondary channel: it does not replace 112 or EU-Alert.</p>';

/* ------------------------------------------------------------------ cálculo por caso */
function bestSat(net, tMs, obs) {
  if (net === 'qo100') { const l = look(obs, geoEcef(QO100.lon)); return l.el >= NETS.qo100.minEl ? { name: 'QO-100', ecef: geoEcef(QO100.lon), ...l } : null; }
  let best = null; for (const el of ELS[net]) { const s = satEcef(el, tMs), l = look(obs, s); if (l.el >= NETS[net].minEl && (!best || l.el > best.el)) best = { name: el.name, ecef: s, ...l }; }
  return best;
}
function nextPass(net, tMs, obs) { for (let dt = 30; dt <= 7200; dt += 30) if (bestSat(net, tMs + dt * 1000, obs)) return dt; return null; }
function select(c) { st.sel = c; st.lon0 = c.lon; st.lat0 = Math.max(20, c.lat - 4); panel(); }
let lastPanelSec = -1;
function panel() {
  const c = st.sel, tMs = EPOCH + st.simT * 1000, n = NETS[st.net], best = bestSat(st.net, tMs, c);
  document.querySelectorAll('#cases button').forEach((b) => b.classList.toggle('on', b.dataset.id === c.id));
  document.querySelectorAll('#nets button').forEach((b) => b.classList.toggle('on', b.dataset.net === st.net));
  const lostSet = new Set(c.lost), avail = ['SMS', 'SAT_D2C_SMS', 'MESHTASTIC', 'IRIDIUM_SBD'].filter((b) => !lostSet.has(b)).map((id) => ({ id }));
  const plan = planMultiBearer(600, avail, { target: 0.99 });
  $('#case-panel').innerHTML = `<p class="m" style="margin:0">${T(KIND[c.kind])} · ${T(c.date)}</p><h2 style="margin:2px 0 6px">${T(c.name)}</h2><p style="margin:0 0 6px">${T(c.what)}</p>
    <p class="m" style="margin:0 0 6px;font-size:13px">${T(TX.source)}: <a href="${c.src}" ${c.src.startsWith('/') ? '' : 'target="_blank" rel="noopener noreferrer"'}>${c.src.startsWith('/') ? c.src : new URL(c.src).hostname}</a> · ${T(TX.lost)}: ${c.lost.length ? c.lost.join(', ') : '—'}</p>
    <div class="mods">${c.mods.map((m) => `<a href="${MOD[m].href}" title="${T(MOD[m].d)}">${MOD[m][LANG]}</a>`).join('')}</div>
    <p class="m" style="margin:8px 0 0;font-size:13px">${T(TX.plan)}: <b style="color:var(--e)">${plan.k} ${LANG === 'es' ? 'de' : 'of'} ${plan.n} ${LANG === 'es' ? 'fragmentos bastan' : 'shards suffice'} · P = ${(plan.pDelivery * 100).toFixed(2).replace('.', LANG === 'es' ? ',' : '.')} %</b> <span class="m">(${[...new Set(plan.messages.map((x) => x.id))].map((b) => BL[b][LANG]).join(' + ')})</span></p>`;
  $('#t-route').textContent = `${T(TX.route)} ${T(n.name)}`;
  const nf = (x, d = 0) => x.toLocaleString(LANG === 'es' ? 'es-ES' : 'en-GB', { maximumFractionDigits: d, minimumFractionDigits: d });
  if (best) $('#kv').innerHTML = `<div><b>${nf(best.el, 1)}°</b><span>${T(TX.el)} · ${best.name}</span></div><div><b>${nf(best.range)} km</b><span>${T(TX.range)}</span></div><div><b>${nf((best.range / C_KMS) * 1000, 1)} ms</b><span>${T(TX.delay)}</span></div>`;
  else { const np = nextPass(st.net, tMs, c); $('#kv').innerHTML = `<div style="grid-column:1/-1"><b style="font-size:15px">${T(TX.none)}</b><span>${T(TX.next)} ${np != null ? Math.round(np / 60) + ' min' : '—'}</span></div>`; }
  $('#steps').innerHTML = STEPS[st.net][LANG].map((s) => `<li>${s}</li>`).join('');
  $('#net-note').innerHTML = `<b>${T(n.name)}</b> · ${LANG === 'es' ? 'carga útil' : 'payload'} ${T(n.payload)} · ${T(n.legal)}`;
  window.SENDA_OJO = { cases: CASES.length, selected: c.id, net: st.net, path: best ? { sat: best.name, elevationDeg: +best.el.toFixed(1), rangeKm: Math.round(best.range), delayMs: +((best.range / C_KMS) * 1000).toFixed(2) } : null, plan: { k: plan.k, n: plan.n, p: plan.pDelivery }, visible: st.visible };
}

/* ------------------------------------------------------------------ dibujo */
function frame(now) {
  const dt = Math.min(0.1, (now - st.last) / 1000); st.last = now; if (st.playing) st.simT += dt * st.speed;
  const W = st.W, H = st.H, tMs = EPOCH + st.simT * 1000;
  const R = Math.min(W, H) * 0.36 * st.zoom, cx = W / 2, cy = H / 2;
  const la = st.lat0 * D, lo = st.lon0 * D, F = [Math.cos(la) * Math.cos(lo), Math.cos(la) * Math.sin(lo), Math.sin(la)], E = [-Math.sin(lo), Math.cos(lo), 0], N = [-Math.sin(la) * Math.cos(lo), -Math.sin(la) * Math.sin(lo), Math.cos(la)];
  const P = (v, r = 1) => ({ x: cx + R * r * dot(v, E), y: cy - R * r * dot(v, N), z: dot(v, F) });
  const hidden = (p, r) => p.z < 0 && Math.hypot(p.x - cx, p.y - cy) < R;
  // espacio
  g.fillStyle = '#02050a'; g.fillRect(0, 0, W, H);
  for (const s of STARS) { g.fillStyle = `rgba(220,235,255,${0.25 + 0.5 * s.s})`; g.fillRect(s.x * W, s.y * H, 1 + s.s, 1 + s.s); }
  // atmósfera y planeta
  let gr = g.createRadialGradient(cx, cy, R * 0.95, cx, cy, R * 1.18); gr.addColorStop(0, 'rgba(120,200,255,.35)'); gr.addColorStop(1, 'rgba(120,200,255,0)'); g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, R * 1.18, 0, 7); g.fill();
  gr = g.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R); gr.addColorStop(0, '#1b4f74'); gr.addColorStop(0.7, '#0b2a42'); gr.addColorStop(1, '#061726'); g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
  g.save(); g.beginPath(); g.arc(cx, cy, R, 0, 7); g.clip();
  g.strokeStyle = 'rgba(145,215,232,.10)'; g.lineWidth = 1;
  for (let lat = -60; lat <= 60; lat += 30) { g.beginPath(); let pen = false; for (let lon = -180; lon <= 180; lon += 4) { const p = P(ecefUnit(lat, lon)); if (p.z > 0) { pen ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); pen = true; } else pen = false; } g.stroke(); }
  for (let lon = -180; lon < 180; lon += 30) { g.beginPath(); let pen = false; for (let lat = -88; lat <= 88; lat += 4) { const p = P(ecefUnit(lat, lon)); if (p.z > 0) { pen ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); pen = true; } else pen = false; } g.stroke(); }
  if (LAND) { g.fillStyle = 'rgba(64,145,118,.55)'; g.strokeStyle = 'rgba(140,230,190,.65)'; g.lineWidth = 0.8;
    for (const ring of LAND) { // relleno: un único trazo continuo; los vértices ocultos se proyectan sobre el limbo (sin cuerdas falsas)
      const pts = []; let vis = 0;
      for (let i = 0; i < ring.length; i += 2) { const p = P(ecefUnit(ring[i + 1], ring[i])); if (p.z > 0) vis++; else { const q = Math.hypot(p.x - cx, p.y - cy) || 1; p.x = cx + ((p.x - cx) / q) * R; p.y = cy + ((p.y - cy) / q) * R; } pts.push(p); }
      if (vis < 2) continue;
      g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y))); g.closePath(); g.fill();
      g.beginPath(); let pen = false; for (const p of pts) { if (p.z > 0) { pen ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); pen = true; } else pen = false; } g.stroke(); } }
  // noche: hemisferio opuesto al punto subsolar
  const day = (tMs - Date.UTC(new Date(tMs).getUTCFullYear(), 0, 0)) / 864e5, dec = -23.44 * Math.cos((2 * Math.PI * (day + 10)) / 365), sunLon = -15 * ((tMs / 36e5) % 24 - 12);
  const sv = ecefUnit(dec, sunLon), sz = dot(sv, F), sx = dot(sv, E), sy = -dot(sv, N), sa = Math.hypot(sx, sy);
  if (sz < 0.999) { // la noche es la región del disco con p·sol < 0: limbo + media elipse de semieje |sz| (exacto en proyección ortográfica)
    const ux = sa > 1e-6 ? sx / sa : 1, uy = sa > 1e-6 ? sy / sa : 0, wx = -uy, wy = ux, pt = (a2, b2) => [cx + R * (a2 * ux + b2 * wx), cy + R * (a2 * uy + b2 * wy)];
    g.save(); g.fillStyle = 'rgba(1,3,8,.58)'; g.beginPath();
    for (let th = 90; th >= -90; th -= 3) { const [x, y] = pt(-Math.cos(th * D), Math.sin(th * D)); th === 90 ? g.moveTo(x, y) : g.lineTo(x, y); }
    for (let th = -90; th <= 90; th += 3) { const [x, y] = pt(-sz * Math.cos(th * D), Math.sin(th * D)); g.lineTo(x, y); }
    g.closePath(); g.fill(); g.restore();
  }
  g.restore();
  // órbitas, estelas y satélites
  const vis = { iridium: 0, galileo: 0, qo100: 0 }, obs = st.sel;
  for (const net of ['galileo', 'iridium']) {
    if (!st.show[net]) continue; const col = NETS[net].color, rr = dispR(NETS[net].altKm), planes = new Set();
    for (const el of ELS[net]) {
      if (!planes.has(el.raan)) { planes.add(el.raan); g.strokeStyle = col + '22'; g.lineWidth = 1; g.beginPath(); let pen = false;
        for (let m = 0; m <= 360; m += 6) { const s = satEcef({ ...el, M: el.M + m * D }, tMs), p = P(s.map((v) => v / Math.hypot(...s)), rr); if (!hidden(p)) { pen ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); pen = true; } else pen = false; } g.stroke(); }
      const s = satEcef(el, tMs), u = s.map((v) => v / Math.hypot(...s)), p = P(u, rr); if (hidden(p)) continue;
      const step = net === 'iridium' ? 40 : 600; g.strokeStyle = col + '66'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(p.x, p.y);
      for (let k2 = 1; k2 <= 5; k2++) { const s2 = satEcef(el, tMs - k2 * step * 1000), q = P(s2.map((v) => v / Math.hypot(...s2)), rr); g.lineTo(q.x, q.y); } g.stroke();
      const inView = look(obs, s).el >= NETS[net].minEl; if (inView) vis[net]++;
      g.fillStyle = col; g.globalAlpha = inView ? 1 : 0.75; g.beginPath(); g.arc(p.x, p.y, inView ? 3.6 : 2.4, 0, 7); g.fill(); g.globalAlpha = 1;
      if (inView) { g.strokeStyle = col; g.beginPath(); g.moveTo(p.x - 6, p.y); g.lineTo(p.x + 6, p.y); g.stroke(); }
    }
  }
  if (st.show.qo100) { const s = geoEcef(QO100.lon), p = P(s.map((v) => v / Math.hypot(...s)), dispR(35786)); if (!hidden(p)) { g.fillStyle = NETS.qo100.color; g.beginPath(); g.moveTo(p.x, p.y - 6); g.lineTo(p.x + 6, p.y); g.lineTo(p.x, p.y + 6); g.lineTo(p.x - 6, p.y); g.fill(); g.font = '600 11px Inter'; g.fillText('QO-100 · 25,9° E', p.x + 9, p.y + 4); } if (look(obs, s).el >= 5) vis.qo100 = 1; }
  st.visible = vis;
  // relé SENDA
  const rp = P(ecefUnit(RELAY.lat, RELAY.lon));
  // casos
  const pulse = (now / 1000) % 1.6;
  for (const c of CASES) { const p = P(ecefUnit(c.lat, c.lon)); if (p.z <= 0) continue; const col = KIND[c.kind].c, on = c === st.sel;
    if (on) { g.strokeStyle = col; g.globalAlpha = 1 - pulse / 1.6; g.lineWidth = 2; g.beginPath(); g.arc(p.x, p.y, 6 + pulse * 16, 0, 7); g.stroke(); g.globalAlpha = 1; }
    g.fillStyle = col; g.beginPath(); g.arc(p.x, p.y, on ? 5.5 : 4.2, 0, 7); g.fill(); g.strokeStyle = '#02050a'; g.lineWidth = 1.5; g.stroke();
    if (on || st.zoom >= 1.6) { g.font = `${on ? 800 : 600} 12px Inter`; g.fillStyle = '#fff'; g.fillText(T(c.name), p.x + 9, p.y - 7); }
    c._p = p; }
  // ruta del caso elegido
  const best = bestSat(st.net, tMs, obs), op = P(ecefUnit(obs.lat, obs.lon));
  if (best && op.z > 0) { const rr = dispR(NETS[st.net].altKm), sp2 = P(best.ecef.map((v) => v / Math.hypot(...best.ecef)), rr), col = NETS[st.net].color;
    g.strokeStyle = col; g.lineWidth = 2.5; g.beginPath(); g.moveTo(op.x, op.y); g.lineTo(sp2.x, sp2.y); g.stroke();
    const ph = (now / 900) % 1; g.fillStyle = '#fff'; g.beginPath(); g.arc(op.x + (sp2.x - op.x) * ph, op.y + (sp2.y - op.y) * ph, 3.5, 0, 7); g.fill();
    if (rp.z > 0 && st.net !== 'galileo') { g.setLineDash([5, 5]); g.strokeStyle = col + 'aa'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(sp2.x, sp2.y); g.quadraticCurveTo((sp2.x + rp.x) / 2 + 30, (sp2.y + rp.y) / 2 - 40, rp.x, rp.y); g.stroke(); g.setLineDash([]); }
    g.font = '700 12px Inter'; g.fillStyle = col; g.fillText(`${best.name} · ${best.el.toFixed(0)}°`, sp2.x + 8, sp2.y - 8); }
  if (rp.z > 0) { g.fillStyle = '#34d399'; g.fillRect(rp.x - 4, rp.y - 4, 8, 8); g.font = '600 11px Inter'; g.fillStyle = '#34d399'; g.textAlign = 'right'; g.fillText(T(RELAY.name), rp.x - 8, rp.y + 16); g.textAlign = 'left'; }
  const sec = Math.floor(st.simT / 20); if (sec !== lastPanelSec) { lastPanelSec = sec; panel(); }
  $('#hud').textContent = `UTC ${new Date(tMs).toISOString().slice(11, 16)} · ×${st.speed} · ${T(TX.visible)}: Iridium ${vis.iridium} · Galileo ${vis.galileo} · QO-100 ${vis.qo100 ? '✓' : '—'}`;
  cv.setAttribute('aria-label', `${T(st.sel.name)}: ${$('#kv').textContent}`);
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ interacción */
cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); st.drag = { x: e.clientX, y: e.clientY, moved: 0 }; });
cv.addEventListener('pointermove', (e) => { if (!st.drag) return; const dx = e.clientX - st.drag.x, dy = e.clientY - st.drag.y; st.drag.moved += Math.abs(dx) + Math.abs(dy); st.lon0 -= dx * 0.35 / st.zoom; st.lat0 = Math.max(-85, Math.min(85, st.lat0 + dy * 0.35 / st.zoom)); st.drag.x = e.clientX; st.drag.y = e.clientY; });
cv.addEventListener('pointerup', (e) => { if (st.drag && st.drag.moved < 6) { const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; const hit = CASES.find((c) => c._p && c._p.z > 0 && Math.hypot(c._p.x - x, c._p.y - y) < 14); if (hit) select(hit); } st.drag = null; });
cv.addEventListener('wheel', (e) => { e.preventDefault(); st.zoom = Math.max(0.35, Math.min(4, st.zoom * (1 - e.deltaY * 0.0012))); }, { passive: false });
select(st.sel); requestAnimationFrame(frame);
</script>
</body></html>
