<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#070b14;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <radialGradient id="globe-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="orbit-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="#070b14" />

  <!-- Stars Background -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="80" cy="90" r="1" /><circle cx="210" cy="60" r="1.5" /><circle cx="340" cy="110" r="1" />
    <circle cx="780" cy="80" r="1" /><circle cx="890" cy="140" r="1.5" /><circle cx="920" cy="50" r="1" />
    <circle cx="120" cy="480" r="1.5" /><circle cx="860" cy="490" r="1" /><circle cx="740" cy="540" r="1.5" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 35)">
    <rect width="520" height="42" rx="8" fill="#0f172a" stroke="#1e293b" />
    <circle cx="24" cy="21" r="6" fill="#38bdf8" filter="url(#glow6)" />
    <text x="42" y="26" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="1">SENDA · GLOBO TÁCTICO 4D &amp; CINEMÁTICA ORBITAL SGP4</text>
  </g>
  <text x="40" y="98" fill="#94a3b8" font-size="12">Propagación Kepleriana Secular J2 · Efemérides TLE Fechadas · Fusión Multicapa CAP / Terreno GLO-30</text>

  <!-- Central Earth Globe Sphere (Radius 160 at 500, 300) -->
  <g transform="translate(500, 300)">
    <!-- Atmosphere Glow -->
    <circle cx="0" cy="0" r="166" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.25" filter="url(#glow6)" />
    <!-- Sphere -->
    <circle cx="0" cy="0" r="160" fill="url(#globe-radial)" stroke="#334155" stroke-width="1.5" />

    <!-- Lat / Lon Graticule -->
    <ellipse cx="0" cy="0" rx="160" ry="60" fill="none" stroke="#1e293b" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="160" ry="120" fill="none" stroke="#1e293b" stroke-width="1" />
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <ellipse cx="0" cy="0" rx="60" ry="160" fill="none" stroke="#1e293b" stroke-width="1" />
    <ellipse cx="0" cy="0" rx="120" ry="160" fill="none" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#334155" stroke-width="1" />

    <!-- Continents Abstract Silhouettes (Iberia / Europe focus) -->
    <path d="M -15,-40 Q 5,-60 25,-45 Q 40,-30 30,-10 Q 15,10 -5,5 Q -25,-15 -15,-40 Z" fill="#334155" opacity="0.8" />
    <circle cx="5" cy="-25" r="4" fill="#10b981" filter="url(#glow6)" />
    <text x="14" y="-22" fill="#34d399" font-size="9" font-weight="700">Hub Valencia (39.5°N)</text>

    <!-- Look Angle Cone from Ground Observer -->
    <path d="M 5,-25 L 80,-140 L -60,-170 Z" fill="#38bdf8" opacity="0.12" />
    <line x1="5" y1="-25" x2="65" y2="-150" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Satellite Orbit 1: Sentinel-3A (Sun-Synchronous Polar) -->
    <ellipse cx="0" cy="0" rx="90" ry="220" fill="none" stroke="url(#orbit-grad1)" stroke-width="2.5" transform="rotate(-28)" filter="url(#glow6)" />
    <g transform="translate(65, -150)">
      <circle cx="0" cy="0" r="6" fill="#38bdf8" filter="url(#glow6)" />
      <text x="12" y="-4" fill="#f8fafc" font-size="10" font-weight="700">Sentinel-3A</text>
      <text x="12" y="9" fill="#94a3b8" font-size="8">Alt: 814 km · Inc: 98.65° · El: 68.4°</text>
      <text x="12" y="21" fill="#38bdf8" font-size="8">Doppler: -18.42 kHz</text>
    </g>

    <!-- Satellite Orbit 2: ISS (Low Inclination 51.6°) -->
    <ellipse cx="0" cy="0" rx="200" ry="90" fill="none" stroke="#a78bfa" stroke-width="1.75" stroke-dasharray="4,3" transform="rotate(22)" />
    <g transform="translate(-160, 50)">
      <circle cx="0" cy="0" r="5" fill="#a78bfa" />
      <text x="-95" y="-4" fill="#c4b5fd" font-size="9" font-weight="700">ISS (ZARYA)</text>
      <text x="-95" y="8" fill="#94a3b8" font-size="8">Alt: 418 km · Inc: 51.64°</text>
    </g>
  </g>

  <!-- Left Side: Source Health Telemetry Panel -->
  <g transform="translate(60, 150)">
    <rect width="210" height="270" rx="8" fill="#0f172a" stroke="#1e293b" opacity="0.95" />
    <text x="16" y="26" fill="#f8fafc" font-size="11" font-weight="800">FUENTES OPERATIVAS 4D</text>

    <!-- Source Items -->
    <g transform="translate(16, 42)">
      <circle cx="6" cy="6" r="4" fill="#10b981" />
      <text x="16" y="10" fill="#cbd5e1" font-size="9.5">USGS M4.5+ Sismos</text>
      <text x="150" y="10" fill="#10b981" font-size="9" font-weight="700">100%</text>
    </g>
    <g transform="translate(16, 68)">
      <circle cx="6" cy="6" r="4" fill="#10b981" />
      <text x="16" y="10" fill="#cbd5e1" font-size="9.5">NASA EONET V3</text>
      <text x="150" y="10" fill="#10b981" font-size="9" font-weight="700">100%</text>
    </g>
    <g transform="translate(16, 94)">
      <circle cx="6" cy="6" r="4" fill="#10b981" />
      <text x="16" y="10" fill="#cbd5e1" font-size="9.5">Copernicus EFFIS</text>
      <text x="150" y="10" fill="#10b981" font-size="9" font-weight="700">100%</text>
    </g>
    <g transform="translate(16, 120)">
      <circle cx="6" cy="6" r="4" fill="#10b981" />
      <text x="16" y="10" fill="#cbd5e1" font-size="9.5">AEMET CAP Oficial</text>
      <text x="150" y="10" fill="#10b981" font-size="9" font-weight="700">100%</text>
    </g>
    <g transform="translate(16, 146)">
      <circle cx="6" cy="6" r="4" fill="#10b981" />
      <text x="16" y="10" fill="#cbd5e1" font-size="9.5">GDACS Multi-hazard</text>
      <text x="150" y="10" fill="#10b981" font-size="9" font-weight="700">100%</text>
    </g>
    <g transform="translate(16, 172)">
      <circle cx="6" cy="6" r="4" fill="#10b981" />
      <text x="16" y="10" fill="#cbd5e1" font-size="9.5">DATEX II Movilidad</text>
      <text x="150" y="10" fill="#10b981" font-size="9" font-weight="700">100%</text>
    </g>
    <g transform="translate(16, 198)">
      <circle cx="6" cy="6" r="4" fill="#10b981" />
      <text x="16" y="10" fill="#cbd5e1" font-size="9.5">Met Norway / Grid</text>
      <text x="150" y="10" fill="#10b981" font-size="9" font-weight="700">100%</text>
    </g>
    <g transform="translate(16, 224)">
      <circle cx="6" cy="6" r="4" fill="#10b981" />
      <text x="16" y="10" fill="#cbd5e1" font-size="9.5">Mapzen DEM GLO-30</text>
      <text x="150" y="10" fill="#10b981" font-size="9" font-weight="700">100%</text>
    </g>
  </g>

  <!-- Right Side: Tactical Readout Box -->
  <g transform="translate(730, 150)">
    <rect width="210" height="270" rx="8" fill="#0f172a" stroke="#1e293b" opacity="0.95" />
    <text x="16" y="26" fill="#f8fafc" font-size="11" font-weight="800">CÁLCULO TOPOCÉNTRICO</text>

    <text x="16" y="55" fill="#94a3b8" font-size="9" font-weight="700">VECTOR AZIMUTH / ELEVACIÓN</text>
    <text x="16" y="74" fill="#38bdf8" font-size="13" font-weight="800">Az 214.2° · El 68.4°</text>

    <text x="16" y="105" fill="#94a3b8" font-size="9" font-weight="700">TASA DISTANCIA (RHO-DOT)</text>
    <text x="16" y="124" fill="#cbd5e1" font-size="13" font-weight="800">-6.41 km/s (Aproximación)</text>

    <text x="16" y="155" fill="#94a3b8" font-size="9" font-weight="700">DESPLAZAMIENTO DOPPLER</text>
    <text x="16" y="174" fill="#a78bfa" font-size="13" font-weight="800">Δf = -18.42 kHz @ 868M</text>

    <text x="16" y="205" fill="#94a3b8" font-size="9" font-weight="700">ESTADO DE SALUD GLOBAL</text>
    <rect x="16" y="215" width="175" height="36" rx="4" fill="#064e3b" stroke="#10b981" />
    <text x="103" y="238" fill="#ecfdf5" font-size="10.5" font-weight="800" text-anchor="middle">SALUDABLE (8/8 FEEDS)</text>
  </g>

  <!-- Legal Disclaimer Banner -->
  <g transform="translate(60, 520)">
    <rect width="880" height="52" rx="6" fill="#0b1329" stroke="#1e293b" />
    <text x="25" y="22" fill="#fbbf24" font-size="10" font-weight="700">AVISO LEGAL DE GEOMETRÍA SATELITAL:</text>
    <text x="25" y="40" fill="#cbd5e1" font-size="9.5">Una ventana orbital indica línea de vista geométrica; no confiere derecho de transmisión ni enlace RF con operador satelital.</text>
  </g>
</svg>
