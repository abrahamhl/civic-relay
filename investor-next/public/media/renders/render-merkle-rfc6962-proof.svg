<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#070b14;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="grid-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#grid-grad3)" />

  <!-- Title Badge -->
  <g transform="translate(40, 35)">
    <rect width="520" height="42" rx="8" fill="#0f172a" stroke="#1e293b" />
    <circle cx="24" cy="21" r="6" fill="#a78bfa" filter="url(#glow3)" />
    <text x="42" y="26" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="1">RFC 6962 · ÁRBOL MERKLE BINARIO CON PRUEBA DE INCLUSIÓN</text>
  </g>
  <text x="40" y="98" fill="#94a3b8" font-size="12">Separación de Dominios Criptográfica: Hojas (0x00 || Leaf) · Nodos Internos (0x01 || Left || Right)</text>

  <!-- Tree Graph -->
  <!-- Level 0: Merkle Root at (500, 160) -->
  <!-- Level 1: Inner Nodes at (300, 280), (700, 280) -->
  <!-- Level 2: Leaves at (200, 420), (400, 420), (600, 420), (800, 420) -->

  <!-- Audit Path Connections (Highlighted in Purple / Indigo) -->
  <!-- Path: L2 (600,420) -> sibling H3 (800,420) -> Inner Node H23 (700,280) -> sibling H01 (300,280) -> ROOT (500,160) -->

  <!-- Normal Links -->
  <line x1="500" y1="160" x2="300" y2="280" stroke="#818cf8" stroke-width="3" stroke-dasharray="4,4" filter="url(#glow3)" />
  <line x1="500" y1="160" x2="700" y2="280" stroke="#a78bfa" stroke-width="4" filter="url(#glow3)" />

  <line x1="300" y1="280" x2="200" y2="420" stroke="#334155" stroke-width="2" />
  <line x1="300" y1="280" x2="400" y2="420" stroke="#334155" stroke-width="2" />

  <line x1="700" y1="280" x2="600" y2="420" stroke="#a78bfa" stroke-width="4" filter="url(#glow3)" />
  <line x1="700" y1="280" x2="800" y2="420" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4" filter="url(#glow3)" />

  <!-- Merkle Root Node -->
  <g transform="translate(500, 160)">
    <rect x="-140" y="-30" width="280" height="60" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2.5" filter="url(#glow3)" />
    <text x="0" y="-8" fill="#c4b5fd" font-size="11" font-weight="700" text-anchor="middle">MERKLE ROOT (0x01 || H₀₁ || H₂₃)</text>
    <text x="0" y="14" fill="#f8fafc" font-size="10" font-family="monospace" text-anchor="middle">SHA-256: 7f8a...3e4b</text>
  </g>

  <!-- Level 1 Nodes -->
  <!-- H01 (Sibling in Proof Step 2) -->
  <g transform="translate(300, 280)">
    <rect x="-110" y="-28" width="220" height="56" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,2" />
    <rect x="-110" y="-45" width="130" height="16" rx="3" fill="#312e81" />
    <text x="-45" y="-33" fill="#c4b5fd" font-size="9" font-weight="700" text-anchor="middle">SIBLING AUDIT PATH 2</text>
    <text x="0" y="-6" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle">INNER NODE H₀₁ (left)</text>
    <text x="0" y="14" fill="#cbd5e1" font-size="9.5" font-family="monospace" text-anchor="middle">0x01 || H₀ || H₁</text>
  </g>

  <!-- H23 (Calculated Node) -->
  <g transform="translate(700, 280)">
    <rect x="-110" y="-28" width="220" height="56" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2" />
    <text x="0" y="-6" fill="#c4b5fd" font-size="10" font-weight="700" text-anchor="middle">INNER NODE H₂₃ (right)</text>
    <text x="0" y="14" fill="#f8fafc" font-size="9.5" font-family="monospace" text-anchor="middle">0x01 || H₂ || H₃</text>
  </g>

  <!-- Level 2 Leaves -->
  <!-- Leaf 0 -->
  <g transform="translate(200, 420)">
    <rect x="-85" y="-25" width="170" height="50" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="0" y="-4" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">HOJA L₀ (0x00 || D₀)</text>
    <text x="0" y="14" fill="#64748b" font-size="8.5" text-anchor="middle">Reporte SOS AEMET</text>
  </g>

  <!-- Leaf 1 -->
  <g transform="translate(400, 420)">
    <rect x="-85" y="-25" width="170" height="50" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="0" y="-4" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">HOJA L₁ (0x00 || D₁)</text>
    <text x="0" y="14" fill="#64748b" font-size="8.5" text-anchor="middle">Telemetría V16 DGT</text>
  </g>

  <!-- Leaf 2: TARGET OF AUDIT PROOF -->
  <g transform="translate(600, 420)">
    <rect x="-85" y="-25" width="170" height="50" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="2.5" filter="url(#glow3)" />
    <rect x="-85" y="-44" width="140" height="18" rx="3" fill="#047857" />
    <text x="-15" y="-31" fill="#ecfdf5" font-size="9.5" font-weight="700" text-anchor="middle">ELEMENTO A VERIFICAR</text>
    <text x="0" y="-4" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">HOJA L₂ (0x00 || D₂)</text>
    <text x="0" y="14" fill="#d1fae5" font-size="9" text-anchor="middle">Evidencia Incidente #249</text>
  </g>

  <!-- Leaf 3 (Sibling in Proof Step 1) -->
  <g transform="translate(800, 420)">
    <rect x="-85" y="-25" width="170" height="50" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2" />
    <rect x="-85" y="-44" width="130" height="18" rx="3" fill="#0284c7" />
    <text x="-20" y="-31" fill="#f0f9ff" font-size="9.5" font-weight="700" text-anchor="middle">SIBLING AUDIT PATH 1</text>
    <text x="0" y="-4" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">HOJA L₃ (0x00 || D₃)</text>
    <text x="0" y="14" fill="#bae6fd" font-size="9" text-anchor="middle">Hash vecino audit_path</text>
  </g>

  <!-- Bottom Proof Explanation -->
  <g transform="translate(40, 500)">
    <rect width="920" height="75" rx="6" fill="#0b1329" stroke="#1e293b" />
    <text x="25" y="24" fill="#34d399" font-size="11" font-weight="700">ALGORITMO DE VERIFICACIÓN DE INCLUSIÓN RFC 6962:</text>
    <text x="25" y="44" fill="#cbd5e1" font-size="10.5">1. Paso 1: Hash target = SHA-256(0x00 || LeafData₂). Se combina con Sibling H₃ (derecha) → H₂₃ = SHA-256(0x01 || H₂ || H₃)</text>
    <text x="25" y="62" fill="#cbd5e1" font-size="10.5">2. Paso 2: Se combina H₂₃ con Sibling H₀₁ (izquierda) → Root = SHA-256(0x01 || H₀₁ || H₂₃). Coincide exactamente con la raíz pública.</text>
    <rect x="790" y="20" width="115" height="36" rx="4" fill="#14532d" stroke="#22c55e" />
    <text x="847" y="43" fill="#86efac" font-size="11" font-weight="800" text-anchor="middle">VERIFIED ✓</text>
  </g>
</svg>
