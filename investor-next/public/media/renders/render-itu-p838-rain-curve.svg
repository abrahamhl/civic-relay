<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#070b14;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="grid-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#grid-grad2)" />

  <!-- Title Badge -->
  <g transform="translate(40, 35)">
    <rect width="500" height="42" rx="8" fill="#0f172a" stroke="#1e293b" />
    <circle cx="24" cy="21" r="6" fill="#38bdf8" filter="url(#glow2)" />
    <text x="42" y="26" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="1">ITU-R P.838-3 · CURVAS DE ATENUACIÓN POR LLUVIA</text>
  </g>
  <text x="40" y="98" fill="#94a3b8" font-size="12">Modelo Analítico Continuo 1–100 GHz (k_H, k_V, α_H, α_V) · Continuidad Rayleigh sub-1GHz</text>

  <!-- Plot Area Frame -->
  <!-- X: 1 GHz -> 100 GHz (log scale) from x=100 to x=880 -->
  <!-- Y: 0.001 dB/km -> 50 dB/km (log scale) from y=480 down to y=120 -->
  <rect x="100" y="120" width="780" height="360" fill="#080e1c" stroke="#1e293b" rx="6" />

  <!-- Grid Lines Horizontal (Attenuation dB/km) -->
  <!-- Y=480: 0.001 dB/km -->
  <!-- Y=390: 0.01 dB/km -->
  <!-- Y=300: 0.1 dB/km -->
  <!-- Y=210: 1.0 dB/km -->
  <!-- Y=120: 10 dB/km -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="100" y1="480" x2="880" y2="480" />
    <line x1="100" y1="390" x2="880" y2="390" />
    <line x1="100" y1="300" x2="880" y2="300" />
    <line x1="100" y1="210" x2="880" y2="210" />
    <line x1="100" y1="120" x2="880" y2="120" />
  </g>
  <g fill="#64748b" font-size="11" text-anchor="end">
    <text x="90" y="484">0.001</text>
    <text x="90" y="394">0.01</text>
    <text x="90" y="304">0.1</text>
    <text x="90" y="214">1.0</text>
    <text x="90" y="124">10.0</text>
    <text x="35" y="300" fill="#94a3b8" font-size="11" font-weight="700" transform="rotate(-90, 35, 300)" text-anchor="middle">γ_R (dB / km)</text>
  </g>

  <!-- Grid Lines Vertical (Frequency GHz) -->
  <!-- 1 GHz: x=100 -->
  <!-- 2 GHz: x=217 -->
  <!-- 5 GHz: x=372 -->
  <!-- 10 GHz: x=490 -->
  <!-- 20 GHz: x=607 -->
  <!-- 50 GHz: x=762 -->
  <!-- 100 GHz: x=880 -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="100" y1="120" x2="100" y2="480" />
    <line x1="217" y1="120" x2="217" y2="480" />
    <line x1="372" y1="120" x2="372" y2="480" />
    <line x1="490" y1="120" x2="490" y2="480" stroke="#334155" stroke-dasharray="3,3" />
    <line x1="607" y1="120" x2="607" y2="480" />
    <line x1="762" y1="120" x2="762" y2="480" />
    <line x1="880" y1="120" x2="880" y2="480" />
  </g>
  <g fill="#64748b" font-size="11" text-anchor="middle">
    <text x="100" y="505">1 GHz</text>
    <text x="217" y="505">2 GHz</text>
    <text x="372" y="505">5 GHz</text>
    <text x="490" y="505" fill="#38bdf8" font-weight="700">10 GHz (X-Band)</text>
    <text x="607" y="505">20 GHz (Ku/K)</text>
    <text x="762" y="505">50 GHz (V-Band)</text>
    <text x="880" y="505">100 GHz (W-Band)</text>
    <text x="490" y="530" fill="#94a3b8" font-size="11" font-weight="700">Frecuencia Portadora (GHz, escala logarítmica)</text>
  </g>

  <!-- Curve 1: R = 50 mm/h (Heavy tropical / convective storm) - Red/Magenta -->
  <path d="M 100,430 Q 250,400 372,320 T 490,210 T 607,155 T 762,125 T 880,118" fill="none" stroke="#f43f5e" stroke-width="3" filter="url(#glow2)" />
  <circle cx="490" cy="210" r="4.5" fill="#f43f5e" />
  <text x="502" y="205" fill="#fca5a5" font-size="11" font-weight="700">50 mm/h (Tormenta severa) · γ=1.12 dB/km @ 10 GHz</text>

  <!-- Curve 2: R = 25 mm/h (Standard ITU rain test) - Amber/Orange -->
  <path d="M 100,450 Q 250,425 372,360 T 490,250 T 607,190 T 762,150 T 880,140" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <circle cx="490" cy="250" r="4" fill="#f59e0b" />
  <text x="502" y="246" fill="#fde68a" font-size="10.5" font-weight="600">25 mm/h (Lluvia intensa) · γ=0.48 dB/km @ 10 GHz</text>

  <!-- Curve 3: R = 5 mm/h (Moderate stratiform rain) - Cyan -->
  <path d="M 100,475 Q 250,465 372,430 T 490,340 T 607,270 T 762,215 T 880,195" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="490" cy="340" r="4" fill="#38bdf8" />
  <text x="502" y="336" fill="#bae6fd" font-size="10.5" font-weight="600">5 mm/h (Lluvia moderada) · γ=0.06 dB/km @ 10 GHz</text>

  <!-- Legend & Regulatory Badge -->
  <g transform="translate(620, 390)">
    <rect width="240" height="74" rx="6" fill="#0f172a" stroke="#334155" opacity="0.95" />
    <circle cx="18" cy="18" r="4" fill="#f43f5e" />
    <text x="30" y="22" fill="#f8fafc" font-size="10.5">R = 50 mm/h (Polarización H)</text>
    <circle cx="18" cy="38" r="4" fill="#f59e0b" />
    <text x="30" y="42" fill="#f8fafc" font-size="10.5">R = 25 mm/h (Polarización H)</text>
    <circle cx="18" cy="58" r="4" fill="#38bdf8" />
    <text x="30" y="62" fill="#f8fafc" font-size="10.5">R = 5 mm/h (Polarización H)</text>
  </g>

  <!-- Bottom Proof Bar -->
  <g transform="translate(40, 555)">
    <text x="0" y="15" fill="#10b981" font-size="11" font-weight="700">✓ CONFORMIDAD NORMATIVA:</text>
    <text x="180" y="15" fill="#cbd5e1" font-size="11">Error relativo vs Tabla 5 oficial ITU-R P.838-3 &lt; 0.1% · Continuidad analítica a 6 GHz: Δ &lt; 0.0006 dB/km</text>
  </g>
</svg>
