<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="railGradBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#050a12"/>
      <stop offset="100%" stopColor="#0b1320"/>
    </linearGradient>
    <linearGradient id="steelGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.8"/>
      <stop offset="50%" stopColor="#93c5fd" stopOpacity="1"/>
      <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.8"/>
    </linearGradient>
    <linearGradient id="hazardGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#ef4444" stopOpacity="0.9"/>
      <stop offset="100%" stopColor="#f97316" stopOpacity="0.9"/>
    </linearGradient>
    <linearGradient id="citsWave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#10b981" stopOpacity="0.4"/>
      <stop offset="100%" stopColor="#047857" stopOpacity="0.05"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#railGradBg)"/>

  <!-- Grid overlay -->
  <g stroke="#16253b" stroke-width="0.8" opacity="0.4">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500"/>
    <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600 M 800,0 L 800,600 M 900,0 L 900,600"/>
  </g>

  <!-- Title & Meta Header -->
  <text x="40" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.02em">
    SENDA · ARQUITECTURA C-ITS Y FÍSICA DE PREVENCIÓN DE CATÁSTROFES FERROVIARIAS
  </text>
  <text x="40" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
    Auditoría de Enclavamientos (Tempi/Balasore) · Pandeo Térmico de Carril (Kerr) · Acústica Guiada (Adamuz) · C-ITS Paso a Nivel
  </text>
  <rect x="760" y="28" width="200" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="860" y="46" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">
    TRL 5-6 · ISO 26262 / C-ITS
  </text>

  <!-- 1. TRACK INFRASTRUCTURE (Double track with single track bottleneck) -->
  <g id="rail-tracks">
    <!-- Ballast Bed -->
    <polygon points="40,320 960,320 940,380 60,380" fill="#1e293b" opacity="0.6"/>

    <!-- Ties / Sleepers (Traviesas de hormigón) -->
    <g stroke="#334155" stroke-width="5" stroke-linecap="round">
      <line x1="80" y1="335" x2="80" y2="365"/>
      <line x1="130" y1="335" x2="130" y2="365"/>
      <line x1="180" y1="335" x2="180" y2="365"/>
      <line x1="230" y1="335" x2="230" y2="365"/>
      <line x1="280" y1="335" x2="280" y2="365"/>
      <line x1="330" y1="335" x2="330" y2="365"/>
      <line x1="380" y1="335" x2="380" y2="365"/>
      <line x1="430" y1="335" x2="430" y2="365"/>
      <line x1="480" y1="335" x2="480" y2="365"/>
      <line x1="530" y1="335" x2="530" y2="365"/>
      <line x1="580" y1="335" x2="580" y2="365"/>
      <line x1="630" y1="335" x2="630" y2="365"/>
      <line x1="680" y1="335" x2="680" y2="365"/>
      <line x1="730" y1="335" x2="730" y2="365"/>
      <line x1="780" y1="335" x2="780" y2="365"/>
      <line x1="830" y1="335" x2="830" y2="365"/>
      <line x1="880" y1="335" x2="880" y2="365"/>
      <line x1="930" y1="335" x2="930" y2="365"/>
    </g>

    <!-- Steel Rails (60E1 Continuous Welded Rail) -->
    <line x1="50" y1="340" x2="950" y2="340" stroke="url(#steelGlow)" stroke-width="3" filter="url(#glowFilter)"/>
    <line x1="50" y1="360" x2="950" y2="360" stroke="url(#steelGlow)" stroke-width="3" filter="url(#glowFilter)"/>

    <!-- Switch / Desvío (Aguja Balasore) -->
    <path d="M 280,340 L 420,280" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 2"/>
    <rect x="260" y="325" width="35" height="18" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="277" y="338" fill="#f59e0b" font-family="ui-monospace" font-size="9" font-weight="700" text-anchor="middle">SW-17</text>
  </g>

  <!-- 2. HIGH SPEED TRAIN A (Approaching from Left) -->
  <g id="train-a" transform="translate(100, 310)">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="130,0 150,14 130,28" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <!-- Windows -->
    <rect x="15" y="6" width="16" height="10" rx="2" fill="#bae6fd"/>
    <rect x="40" y="6" width="16" height="10" rx="2" fill="#bae6fd"/>
    <rect x="65" y="6" width="16" height="10" rx="2" fill="#bae6fd"/>
    <rect x="90" y="6" width="16" height="10" rx="2" fill="#bae6fd"/>
    <circle x="138" y="14" r="3" fill="#facc15"/>
    <!-- Headlight Cone -->
    <polygon points="150,14 260,-5 260,33" fill="#facc15" opacity="0.15"/>
    <text x="65" y="44" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">
      TREN A (140 km/h)
    </text>
  </g>

  <!-- 3. GUIDED ULTRASONIC WAVE PULSE (Adamuz Detection) -->
  <g id="guided-waves" transform="translate(250, 340)">
    <!-- Ultrasonic Pulse expanding through rail -->
    <path d="M 0,-15 Q 20,0 0,15 M 15,-15 Q 35,0 15,15 M 30,-15 Q 50,0 30,15" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8"/>
    <text x="60" y="-12" fill="#38bdf8" font-family="ui-monospace" font-size="10" font-weight="bold">
      Onda Guiada 5.100 m/s (Lamb / Rayleigh)
    </text>

    <!-- Rail Crack Discontinuity at PK 12.5 -->
    <g transform="translate(220, 0)">
      <line x1="0" y1="-8" x2="0" y2="28" stroke="#ef4444" stroke-width="3"/>
      <circle cx="0" cy="10" r="12" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2 2"/>
      <!-- Reflected Wave -->
      <path d="M -10,-10 Q -25,0 -10,10 M -20,-10 Q -35,0 -20,10" stroke="#ef4444" stroke-width="1.5" fill="none"/>
      <rect x="-60" y="-45" width="120" height="24" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
      <text x="0" y="-30" fill="#fca5a5" font-family="ui-monospace" font-size="9" font-weight="bold" text-anchor="middle">
        ROTURA DE SOLDADURA
      </text>
      <text x="0" y="48" fill="#ef4444" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">
        Eco ToF = 86 ms (d = 2.200 m)
      </text>
    </g>
  </g>

  <!-- 4. LEVEL CROSSING & C-ITS TRAIN-TO-CAR LINK (Right Side) -->
  <g id="level-crossing" transform="translate(680, 240)">
    <!-- Road Crossing the Track -->
    <polygon points="50,0 120,0 80,240 10,240" fill="#334155" opacity="0.7"/>
    <line x1="85" y1="0" x2="45" y2="240" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- Crossing Gate / Barrier -->
    <line x1="20" y1="90" x2="110" y2="90" stroke="#ef4444" stroke-width="4"/>
    <line x1="20" y1="90" x2="110" y2="90" stroke="#f8fafc" stroke-width="4" stroke-dasharray="10 10"/>
    <circle cx="20" cy="90" r="5" fill="#f59e0b"/>

    <!-- Connected Vehicle (Smart Car on Road) -->
    <g transform="translate(65, 40)">
      <rect x="0" y="0" width="30" height="48" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <rect x="4" y="10" width="22" height="12" rx="2" fill="#6ee7b7"/>
      <!-- V16 / C-ITS Direct Antenna -->
      <circle cx="15" cy="5" r="4" fill="#f59e0b" filter="url(#glowFilter)"/>
      <text x="40" y="28" fill="#10b981" font-family="system-ui" font-size="10" font-weight="bold">
        VEHÍCULO V16 C-ITS
      </text>
    </g>

    <!-- C-ITS Direct Radio Cones between Train and Car -->
    <path d="M -80,90 Q 0,40 60,50" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2" fill="none"/>
    <rect x="-140" y="55" width="130" height="34" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="-75" y="70" fill="#6ee7b7" font-family="ui-monospace" font-size="9" font-weight="bold" text-anchor="middle">
      C-ITS DENM ALERTA
    </text>
    <text x="-75" y="82" fill="#a7f3d0" font-family="system-ui" font-size="8" text-anchor="middle">
      Tren a 35 s · Freno Auto
    </text>
  </g>

  <!-- 5. THERMAL TRACK BUCKLING MONITORING BOX -->
  <g id="thermal-buckling-card" transform="translate(50, 430)">
    <rect width="280" height="135" rx="8" fill="#0f172a" stroke="#f97316" stroke-width="1.2"/>
    <rect x="12" y="12" width="12" height="12" rx="3" fill="#f97316"/>
    <text x="32" y="23" fill="#f97316" font-family="system-ui" font-size="12" font-weight="bold">
      FÍSICA DE PANDEO TÉRMICO (KERR)
    </text>
    <text x="14" y="48" fill="#94a3b8" font-family="ui-monospace" font-size="11">
      P = E · A · α · (T_carril - T_n)
    </text>
    <text x="14" y="68" fill="#cbd5e1" font-family="system-ui" font-size="11">
      T_aire: 41°C · T_carril (Solar): <tspan fill="#f97316" font-weight="bold">63.2°C</tspan>
    </text>
    <text x="14" y="88" fill="#cbd5e1" font-family="system-ui" font-size="11">
      Fuerza Axial Compresión: <tspan fill="#f97316" font-weight="bold">1.428 kN</tspan>
    </text>
    <text x="14" y="108" fill="#cbd5e1" font-family="system-ui" font-size="11">
      Carga Crítica Balasto: 1.540 kN (S = 0.92)
    </text>
    <rect x="14" y="116" width="250" height="6" rx="3" fill="#334155"/>
    <rect x="14" y="116" width="230" height="6" rx="3" fill="#ef4444"/>
    <text x="14" y="132" fill="#ef4444" font-family="ui-monospace" font-size="9" font-weight="bold">
      ESTADO: RIESGO CRÍTICO DE SUN KINK (Vmax → 30 km/h)
    </text>
  </g>

  <!-- 6. INTERLOCKING & HEAD-ON COLLISION GUARD (TEMPI) -->
  <g id="interlocking-guard-card" transform="translate(360, 430)">
    <rect width="280" height="135" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="12" y="12" width="12" height="12" rx="3" fill="#38bdf8"/>
    <text x="32" y="23" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="bold">
      AUDITORÍA DE ENCLAVAMIENTO (TEMPI)
    </text>
    <text x="14" y="48" fill="#cbd5e1" font-family="system-ui" font-size="11">
      Cantón: <tspan fill="#38bdf8" font-family="ui-monospace">CANTON-101 (Vía Única)</tspan>
    </text>
    <text x="14" y="68" fill="#cbd5e1" font-family="system-ui" font-size="11">
      Trenes Convergentes: <tspan fill="#fca5a5">INTERCITY-62 vs MERCANTE</tspan>
    </text>
    <text x="14" y="88" fill="#cbd5e1" font-family="system-ui" font-size="11">
      Distancia Relativa: 8.400 m · V_rel: 230 km/h
    </text>
    <text x="14" y="108" fill="#cbd5e1" font-family="system-ui" font-size="11">
      Tiempo a Colisión (TTC): <tspan fill="#ef4444" font-weight="bold">131 segundos</tspan>
    </text>
    <text x="14" y="128" fill="#34d399" font-family="ui-monospace" font-size="9.5" font-weight="bold">
      ACCIÓN: FRENADO DE EMERGENCIA T2T DIRECTO
    </text>
  </g>

  <!-- 7. MULTI-BEARER ACCIDENT RESCUE BEACON (ADAMUZ/TUNNEL) -->
  <g id="multi-bearer-beacon-card" transform="translate(670, 430)">
    <rect width="280" height="135" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <rect x="12" y="12" width="12" height="12" rx="3" fill="#10b981"/>
    <text x="32" y="23" fill="#10b981" font-family="system-ui" font-size="12" font-weight="bold">
      BALIZA MULTIMODAL DE EMERGENCIA
    </text>
    <text x="14" y="48" fill="#cbd5e1" font-family="system-ui" font-size="11">
      Canal 1: <tspan fill="#6ee7b7">BLE C-ITS 2.4 GHz</tspan> (Coches a 120 km/h)
    </text>
    <text x="14" y="68" fill="#cbd5e1" font-family="system-ui" font-size="11">
      Canal 2: <tspan fill="#6ee7b7">LoRa 868 MHz</tspan> (Alcance > 5 km en trinchera)
    </text>
    <text x="14" y="88" fill="#cbd5e1" font-family="system-ui" font-size="11">
      Canal 3: <tspan fill="#6ee7b7">Acústica Ultrasónica 19 kHz</tspan> en carril
    </text>
    <text x="14" y="108" fill="#94a3b8" font-family="ui-monospace" font-size="10">
      Trama OEP-RAIL: AA0300898000452000080E
    </text>
    <text x="14" y="128" fill="#38bdf8" font-family="system-ui" font-size="10" font-weight="bold">
      Retransmisión DTN hacia 112 en &lt; 30 s
    </text>
  </g>
</svg>
