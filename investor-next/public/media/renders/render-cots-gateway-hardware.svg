<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#070b14;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="grid-grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#grid-grad5)" />

  <!-- Title Badge -->
  <g transform="translate(40, 35)">
    <rect width="520" height="42" rx="8" fill="#0f172a" stroke="#1e293b" />
    <circle cx="24" cy="21" r="6" fill="#38bdf8" filter="url(#glow5)" />
    <text x="42" y="26" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="1">CENTINELA GATEWAY COTS &lt;15€ · ESQUEMA DE ARQUITECTURA</text>
  </g>
  <text x="40" y="98" fill="#94a3b8" font-size="12">Hardware Abierto de Bajo Coste para Malla de Emergencia · Repetidor BLE LR, LoRa SX1262 y Sensor Acústico</text>

  <!-- Central Processing Unit: ESP32-S3 Dual Core -->
  <g transform="translate(370, 180)">
    <rect width="260" height="230" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow5)" />
    <rect x="0" y="0" width="260" height="34" rx="10" fill="#0369a1" />
    <text x="130" y="22" fill="#f0f9ff" font-size="12" font-weight="800" text-anchor="middle">ESP32-S3 WROOM-1 (3.20 €)</text>
    <text x="130" y="55" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Xtensa Dual-Core 240 MHz</text>
    <text x="130" y="72" fill="#94a3b8" font-size="9.5" text-anchor="middle">512 KB SRAM + 8 MB PSRAM</text>

    <!-- Sub-blocks inside MCU -->
    <rect x="20" y="90" width="105" height="55" rx="4" fill="#1e293b" stroke="#475569" />
    <text x="72" y="112" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">Bluetooth 5.0</text>
    <text x="72" y="128" fill="#cbd5e1" font-size="8.5" text-anchor="middle">Coded PHY (LR)</text>

    <rect x="135" y="90" width="105" height="55" rx="4" fill="#1e293b" stroke="#475569" />
    <text x="187" y="112" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">Wi-Fi 802.11 b/g/n</text>
    <text x="187" y="128" fill="#cbd5e1" font-size="8.5" text-anchor="middle">ESP-NOW Mesh</text>

    <rect x="20" y="155" width="220" height="55" rx="4" fill="#1e293b" stroke="#475569" />
    <text x="130" y="176" fill="#a78bfa" font-size="9.5" font-weight="700" text-anchor="middle">Acelerador Criptográfico Hardware</text>
    <text x="130" y="194" fill="#cbd5e1" font-size="8.5" text-anchor="middle">Ed25519 · SHA-256 · RNG Seguro</text>
  </g>

  <!-- Left Block 1: LoRa RF Transceiver (SX1262) -->
  <g transform="translate(60, 150)">
    <rect width="240" height="110" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <text x="20" y="28" fill="#10b981" font-size="12" font-weight="800">Semtech SX1262 (3.80 €)</text>
    <text x="20" y="48" fill="#f8fafc" font-size="10">Transceptor LoRa 868 / 915 MHz</text>
    <text x="20" y="65" fill="#94a3b8" font-size="9">+22 dBm PIRE · Sensibilidad: -148 dBm</text>
    <text x="20" y="82" fill="#34d399" font-size="9.5" font-weight="600">Alcance orográfico &gt; 12 km (LoS)</text>
    <line x1="240" y1="55" x2="370" y2="230" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2" />
    <text x="310" y="160" fill="#10b981" font-size="8.5">SPI Bus</text>
  </g>

  <!-- Left Block 2: I2S MEMS Ultrasonic Mic Array -->
  <g transform="translate(60, 310)">
    <rect width="240" height="110" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <text x="20" y="28" fill="#f59e0b" font-size="12" font-weight="800">2x INMP441 MEMS (1.60 €)</text>
    <text x="20" y="48" fill="#f8fafc" font-size="10">Array Acústico I2S Digital</text>
    <text x="20" y="65" fill="#94a3b8" font-size="9">Banda Ultra-sónica: 18 – 22 kHz</text>
    <text x="20" y="82" fill="#fde68a" font-size="9.5" font-weight="600">Recepción Baliza de Supervivencia</text>
    <line x1="240" y1="365" x2="370" y2="340" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2" />
    <text x="310" y="345" fill="#f59e0b" font-size="8.5">I2S Bus</text>
  </g>

  <!-- Right Block 1: Power & Battery Management -->
  <g transform="translate(700, 150)">
    <rect width="240" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="20" y="28" fill="#38bdf8" font-size="12" font-weight="800">BMS TP4056 + MPPT (1.90 €)</text>
    <text x="20" y="48" fill="#f8fafc" font-size="10">Gestión Batería LiFePO4 / Li-Ion</text>
    <text x="20" y="65" fill="#94a3b8" font-size="9">Célula 18650 3.2V 2500 mAh</text>
    <text x="20" y="82" fill="#38bdf8" font-size="9.5" font-weight="600">Autonomía &gt; 96 h (Duty Cycle 1%)</text>
    <line x1="700" y1="205" x2="630" y2="230" stroke="#38bdf8" stroke-width="2" />
    <text x="655" y="210" fill="#38bdf8" font-size="8.5">3.3V LDO</text>
  </g>

  <!-- Right Block 2: Environmental Barometer & Antennas -->
  <g transform="translate(700, 310)">
    <rect width="240" height="110" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <text x="20" y="28" fill="#a855f7" font-size="12" font-weight="800">BMP280 + Antena (1.70 €)</text>
    <text x="20" y="48" fill="#f8fafc" font-size="10">Barómetro Hipsométrico + Dipolo</text>
    <text x="20" y="65" fill="#94a3b8" font-size="9">Presión 0.12 hPa (≈ 1 m altitud)</text>
    <text x="20" y="82" fill="#e9d5ff" font-size="9.5" font-weight="600">Antena helicoidal 868 MHz + BLE</text>
    <line x1="700" y1="365" x2="630" y2="340" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,2" />
    <text x="655" y="345" fill="#a855f7" font-size="8.5">I2C Bus</text>
  </g>

  <!-- Cost Breakdown Banner -->
  <g transform="translate(60, 470)">
    <rect width="880" height="90" rx="8" fill="#0b1329" stroke="#1e293b" />
    <text x="30" y="30" fill="#38bdf8" font-size="12" font-weight="800">DESGLOSE DE COSTES BOM COTS (PROVEEDORES ESTÁNDAR / ALIEXPRESS / MOUSER):</text>
    <text x="30" y="55" fill="#cbd5e1" font-size="11">ESP32-S3 (3.20 €) + SX1262 (3.80 €) + 2x INMP441 (1.60 €) + BMP280 (0.90 €) + BMS TP4056 (1.00 €) + Antenas/Cables (1.50 €) + Caja IP67 (2.20 €)</text>
    <rect x="710" y="20" width="170" height="50" rx="6" fill="#064e3b" stroke="#10b981" />
    <text x="795" y="42" fill="#ecfdf5" font-size="10" font-weight="700" text-anchor="middle">COSTE TOTAL BOM</text>
    <text x="795" y="62" fill="#34d399" font-size="17" font-weight="800" text-anchor="middle">14,20 € / unidad</text>
  </g>
</svg>
